<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قاموس التحريك · Motion Lexicon</title>
<meta name="description" content="مرجع مصوّر بالعربي والإنجليزي لكل ما تحتاجه قبل التحريك بالذكاء الاصطناعي: حركات الكاميرا، اللقطات، الإضاءة، الانتقالات، موشن الـ UI والموشن جرافيك، مع أمثلة حية وبرومبتات جاهزة.">
<meta property="og:title" content="قاموس التحريك · Motion Lexicon">
<meta property="og:description" content="255 motion terms with live examples and copy-ready prompts for AI video, UI motion and motion graphics. Arabic & English.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://motioneffectname.com/">
<link rel="canonical" href="https://motioneffectname.com/">
<meta name="theme-color" content="#2944D1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;500;700&display=swap">
<style>
/* Layout: slim sticky index bar over a long specimen sheet. Each section = intro strip + auto-fill grid of specimen cards (live demo on top, name / meaning / copyable prompt below). */
:root{
  --bg:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6F9; --ink:#131722; --ink-2:#4A5163; --ink-3:#868DA0; --line:#DADEE7;
  --accent:#2944D1; --accent-soft:#E2E7FB; --on-accent:#FFFFFF; --key:#DE9227; --ok:#1C9A67; --bad:#DD4538; --heart:#E3365A;
  --stage:#E3E6ED; --sk-hi:#F3F4F8; --shadow:rgba(19,23,34,.16); --iso-t:#C9D2F7; --iso-r:#1B2F9E;
  --f-disp:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* fixed scene palette (an illustration, identical in both themes) */
  --sc-sky1:#8DB2DC; --sc-sky2:#F1D1AC; --sc-far:#8795C0; --sc-snow:#E9EDF7; --sc-mid:#4D6C8E; --sc-tree:#2D4A67; --sc-ground:#3A5573;
  --sc-fg:#1C2E45; --sc-fig:#DE9227; --sc-fig2:#1B2436; --sc-skin:#E7B68C; --sc-hair:#2B1D16; --sc-sun:#FFE6A8; --sc-cloud:#F7F2EA;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D0F15; --surface:#161A23; --surface-2:#1C212C; --ink:#E8EBF2; --ink-2:#A8AFBF; --ink-3:#6D7588; --line:#2A303D;
  --accent:#8C9CFF; --accent-soft:#1F2647; --on-accent:#0D0F15; --key:#F0B04E; --ok:#3CC48C; --bad:#FF6A5E; --heart:#FF5C7A;
  --stage:#1B1F2A; --sk-hi:#323949; --shadow:rgba(0,0,0,.55); --iso-t:#3A4580; --iso-r:#2A3470; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D0F15; --surface:#161A23; --surface-2:#1C212C; --ink:#E8EBF2; --ink-2:#A8AFBF; --ink-3:#6D7588; --line:#2A303D;
  --accent:#8C9CFF; --accent-soft:#1F2647; --on-accent:#0D0F15; --key:#F0B04E; --ok:#3CC48C; --bad:#FF6A5E; --heart:#FF5C7A;
  --stage:#1B1F2A; --sk-hi:#323949; --shadow:rgba(0,0,0,.55); --iso-t:#3A4580; --iso-r:#2A3470; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
#app{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 60px}
h1,h2,h3,h4{font-family:var(--f-disp);text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono)}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin-inline:-20px;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar .brand{font:700 15px var(--f-disp);white-space:nowrap}
.bar nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 360px;min-width:0}
.bar nav::-webkit-scrollbar{display:none}
.bar nav a{white-space:nowrap;text-decoration:none;color:var(--ink-2);font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid transparent}
.bar nav a:hover{color:var(--ink);border-color:var(--line)}
.bar nav a b{font:500 11px var(--f-mono);color:var(--ink-3);margin-inline-start:4px}
.tools{display:flex;gap:8px;align-items:center;flex:1 1 280px;justify-content:flex-end;min-width:0}
.search{flex:1;min-width:0;max-width:280px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;font:14px var(--f-body)}
.btn-ghost{height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:13px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{border-color:var(--ink-3)}

/* ---------- hero ---------- */
.hero{padding-block:56px 30px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:40px;align-items:end}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.hero h1{font-size:clamp(44px,7vw,88px);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin-block:10px 14px}
.hero h1 span{color:var(--accent)}
.lede{font-size:17px;color:var(--ink-2);max-width:60ch;margin:0}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}
.stats div{display:grid}
.stats b{font:500 26px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.stats span{font-size:12px;color:var(--ink-3)}
.tl-hero{direction:ltr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 16px}
.tl-hero .tc{display:flex;justify-content:space-between;align-items:baseline;font:500 12px var(--f-mono);color:var(--ink-3)}
.tl-hero .tc b{font:500 22px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tracks{position:relative;margin-top:12px;display:grid;gap:8px}
.ruler{height:16px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 1px,transparent 1px 10%) ,repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2.5%);background-size:100% 100%,100% 45%;background-repeat:no-repeat;background-position:0 0,0 100%;opacity:.8}
.trk-h{position:relative;height:26px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.trk-h span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font:500 10px var(--f-mono);color:var(--ink-3);letter-spacing:.06em}
.kf{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--key);transform:rotate(45deg);border-radius:1px}
.kf.ln{background:var(--accent)}
.clip{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 40%,transparent)}
.playhead{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);left:0;animation:ph 6s linear infinite}
.playhead::before{content:"";position:absolute;top:-4px;left:-5px;border:6px solid transparent;border-top-color:var(--bad)}
@keyframes ph{from{left:0}to{left:100%}}

/* ---------- composer ---------- */
.composer{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;margin-block:10px 20px}
.composer h2{font-size:22px}
.composer p.sub{margin:4px 0 14px;color:var(--ink-2);font-size:14px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fields label{display:grid;gap:4px;font-size:12px;color:var(--ink-3)}
.fields .full{grid-column:1/-1}
.fields select,.fields input{height:38px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:0 10px;font:14px var(--f-body);min-width:0;width:100%}
.fields input{direction:ltr;text-align:left}
.out{display:flex;flex-direction:column;gap:10px;min-width:0}
.out .formula{font:500 12px var(--f-mono);color:var(--ink-3);direction:ltr;text-align:left;line-height:1.6}
.out .formula i{font-style:normal;color:var(--accent)}
.out pre{margin:0;flex:1;min-height:150px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;font:14px/1.65 var(--f-mono);color:var(--ink)}
.out .row{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.hint{font-size:12.5px;color:var(--ink-3)}
.btn{height:38px;border-radius:9px;border:0;background:var(--accent);color:var(--on-accent);padding:0 16px;font:600 14px var(--f-body);cursor:pointer}

/* ---------- sections ---------- */
section.sec{padding-top:40px;scroll-margin-top:70px}
.sec-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 30px;align-items:end;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sec-head h2{font-size:clamp(28px,4vw,40px);font-weight:700;line-height:1.15}
.sec-head .en{font:500 12px var(--f-mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.sec-head p{grid-column:1/-1;margin:0;color:var(--ink-2);max-width:75ch}
.sec-head .toolsline{grid-column:1/-1;font:12px var(--f-mono);color:var(--ink-3);direction:ltr;text-align:right}
.grp{margin-block:26px 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.grp h3{font-size:19px;font-weight:500}
.grp span{font:500 11px var(--f-mono);color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card .cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.nm{display:flex;flex-direction:column;gap:0}
.nm h4{font:600 16.5px/1.3 var(--f-disp);direction:ltr;text-align:right;letter-spacing:.005em}
.nm .ar{font-size:13.5px;color:var(--accent);font-weight:500}
.card p{margin:0;font-size:13.5px;line-height:1.75;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:4px;direction:ltr;justify-content:flex-end}
.chips span{font:500 10.5px var(--f-mono);color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.chips span.k{color:var(--key);border-color:color-mix(in srgb,var(--key) 45%,transparent)}
.pr{margin-top:auto;display:flex;gap:6px;align-items:stretch;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 8px;min-width:0}
.pr code{flex:1;min-width:0;direction:ltr;text-align:left;font:11.5px/1.55 var(--f-mono);color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:text}
.pr code.open{-webkit-line-clamp:unset}
.cp{flex:none;align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:12px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.cp.done{background:var(--ok);border-color:var(--ok);color:#fff}
.empty{padding:40px 0;text-align:center;color:var(--ink-3)}

/* pause offscreen / when motion is stopped */
.card:not(.on) .demo,.card:not(.on) .demo *,.card:not(.on) .demo *::before,.card:not(.on) .demo *::after,
body.still .demo,body.still .demo *,body.still .demo *::before,body.still .demo *::after,body.still .playhead{animation-play-state:paused!important}

/* ---------- demo base ---------- */
.demo{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--stage);direction:ltr;flex:none;max-width:100%}
.tag{position:absolute;left:8px;top:8px;z-index:5;font:500 10px var(--f-mono);letter-spacing:.06em;color:#fff;background:rgba(12,16,26,.55);padding:2px 7px;border-radius:4px}
.st{position:absolute;inset:0;display:grid;place-items:center}
.st.col{display:flex;flex-direction:column;gap:10px;justify-content:center;align-items:center}
.fing{position:absolute;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.6);border:2px solid var(--ink);box-shadow:0 2px 6px var(--shadow);z-index:6}

/* ---------- camera scene ---------- */
.scene{background:var(--sc-sky1)}
.world{position:absolute;inset:0}
.L{position:absolute;inset:-20% -40%;transform-origin:50% 56%}
.L svg{display:block;width:100%;height:100%}
.sky{background:linear-gradient(var(--sc-sky1) 20%,var(--sc-sky2) 62%)}
.c-far{fill:var(--sc-far)}.c-snow{fill:var(--sc-snow)}.c-mid{fill:var(--sc-mid)}.c-tree{fill:var(--sc-tree)}.c-ground{fill:var(--sc-ground)}
.c-fg{fill:var(--sc-fg)}.c-fig{fill:var(--sc-fig)}.c-fig2{fill:var(--sc-fig2)}.c-skin{fill:var(--sc-skin)}.c-hair{fill:var(--sc-hair)}
.c-sun{fill:var(--sc-sun)}.c-cloud{fill:var(--sc-cloud);opacity:.9}.c-shadow{fill:rgba(0,0,0,.28)}.c-eye{fill:#1a1a1a}
.fig,.sun,.clouds{transform-box:fill-box;transform-origin:center}

[data-a=pan] .L{animation:pan 5s ease-in-out infinite alternate}
@keyframes pan{0%,10%{transform:translateX(9%)}90%,100%{transform:translateX(-9%)}}
[data-a=tilt] .L{animation:tilt 5s ease-in-out infinite alternate}
@keyframes tilt{0%,10%{transform:translateY(-7%)}90%,100%{transform:translateY(7%)}}
[data-a=zoom] .L{animation:zoom 5s ease-in-out infinite alternate}
@keyframes zoom{0%,12%{transform:scale(1)}88%,100%{transform:scale(1.55)}}
[data-a=dolly] .L{animation:dolly 5s ease-in-out infinite alternate}
@keyframes dolly{0%,12%{transform:scale(1)}88%,100%{transform:scale(calc(1 + var(--d) * .5))}}
[data-a=truck] .L{animation:truck 5s ease-in-out infinite alternate}
@keyframes truck{0%,10%{transform:translateX(calc(var(--d) * 8%))}90%,100%{transform:translateX(calc(var(--d) * -8%))}}
[data-a=pedestal] .L{animation:pedestal 5s ease-in-out infinite alternate}
@keyframes pedestal{0%,10%{transform:translateY(calc(var(--d) * -6%))}90%,100%{transform:translateY(calc(var(--d) * 7%))}}
[data-a=arc] .L{animation:arc 5s ease-in-out infinite alternate}
@keyframes arc{0%,8%{transform:translateX(calc((var(--d) - .75) * 22%))}92%,100%{transform:translateX(calc((var(--d) - .75) * -22%))}}
[data-a=crane] .L{animation:crane 6s ease-in-out infinite alternate}
@keyframes crane{0%,10%{transform:translateY(calc(var(--d) * -4%)) scale(1.1)}90%,100%{transform:translateY(calc(var(--d) * 9%)) scale(calc(1 - var(--d) * .12))}}
[data-a=dollyzoom] .L{animation:dz 5s ease-in-out infinite alternate}
@keyframes dz{0%,10%{transform:scale(1)}90%,100%{transform:scale(max(.82,calc(1 + (.75 - var(--d)) * 1.1)))}}
[data-a=roll] .L{animation:roll 5s ease-in-out infinite alternate}
@keyframes roll{0%,8%{transform:rotate(-20deg) scale(1.15)}92%,100%{transform:rotate(20deg) scale(1.15)}}
[data-a=whip] .L{animation:whip 2.8s ease-in-out infinite alternate}
@keyframes whip{0%,38%{transform:translateX(9%);filter:blur(0)}50%{transform:translateX(0);filter:blur(7px)}62%,100%{transform:translateX(-9%);filter:blur(0)}}
[data-a=crash] .L{transform-origin:50% 39.7%;animation:crash 3.6s infinite}
@keyframes crash{0%,40%{transform:scale(1);animation-timing-function:cubic-bezier(.8,0,.9,.6)}50%,88%{transform:scale(3.2)}100%{transform:scale(1)}}
[data-a=tracking] .L{animation:tracking 6s linear infinite alternate}
@keyframes tracking{from{transform:translateX(calc((var(--d) - .75) * 26%))}to{transform:translateX(calc((var(--d) - .75) * -26%))}}
[data-a=tracking] .fig,[data-a=realtime] .fig{animation:bob .45s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.3px)}}
[data-a=reveal] .L{transform-origin:50% 39.7%;animation:reveal 6s ease-in-out infinite alternate}
@keyframes reveal{0%,12%{transform:scale(calc(1 + var(--d) * 3.8))}88%,100%{transform:scale(1)}}
[data-a=fpv] .L{animation:fpv 3.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes fpv{0%{transform:scale(1) translateX(0) rotate(0)}45%{transform:scale(calc(1 + var(--d) * .55)) translateX(calc(var(--d) * 5%)) rotate(-9deg)}100%{transform:scale(calc(1 + var(--d) * 1.1)) translateX(calc(var(--d) * -4%)) rotate(7deg)}}
[data-a=drone] .L{animation:drone 6s ease-in-out infinite alternate}
@keyframes drone{0%,10%{transform:translateY(calc(var(--d) * -11%))}90%,100%{transform:translateY(calc(var(--d) * 9%)) scale(calc(1 - var(--d) * .1))}}
[data-a=spiral] .L{animation:spiral 5s ease-in-out infinite alternate}
@keyframes spiral{0%,8%{transform:rotate(-24deg) scale(1.15)}92%,100%{transform:rotate(18deg) scale(calc(1.15 + var(--d) * .5))}}
[data-a=snorri] .L:not(.subj){animation:snorri 2.4s ease-in-out infinite alternate}
@keyframes snorri{from{transform:rotate(-7deg) translate(-2%,1%) scale(1.12)}to{transform:rotate(7deg) translate(2%,-1%) scale(1.12)}}
[data-a=static] .fig,[data-a=deep] .fig{animation:walkx 6s ease-in-out infinite alternate}
@keyframes walkx{from{transform:translateX(-34px)}to{transform:translateX(34px)}}
[data-a=handheld] .world{animation:hh 3s ease-in-out infinite}
@keyframes hh{0%{transform:translate(0,0) rotate(0) scale(1.06)}12%{transform:translate(-1.2%,.6%) rotate(-.6deg) scale(1.06)}27%{transform:translate(.8%,-.8%) rotate(.5deg) scale(1.06)}41%{transform:translate(-.4%,1%) rotate(-.2deg) scale(1.06)}55%{transform:translate(1.1%,.2%) rotate(.7deg) scale(1.06)}70%{transform:translate(-.9%,-.7%) rotate(-.5deg) scale(1.06)}84%{transform:translate(.5%,.9%) rotate(.3deg) scale(1.06)}100%{transform:translate(0,0) rotate(0) scale(1.06)}}
[data-a=gimbal] .L{animation:gimbal 6s cubic-bezier(.45,0,.55,1) infinite alternate}
@keyframes gimbal{0%,6%{transform:scale(1) translateX(calc((var(--d) - .75) * 6%))}94%,100%{transform:scale(calc(1 + var(--d) * .28)) translateX(calc((var(--d) - .75) * -6%))}}

/* shots */
[data-shot] .world{transform-origin:var(--ox) var(--oy);animation:shotz 5.5s cubic-bezier(.65,0,.35,1) infinite}
@keyframes shotz{0%,24%{transform:scale(1)}44%,88%{transform:scale(var(--k))}100%{transform:scale(1)}}
[data-shot].still .world{animation:none;transform:scale(var(--k))}
.crop{position:absolute;border:1.5px dashed #fff;box-shadow:0 0 0 999px rgba(10,14,24,.35);border-radius:2px;animation:cropv 5.5s infinite;z-index:3}
@keyframes cropv{0%,22%{opacity:1}30%,94%{opacity:0}100%{opacity:1}}

/* angles in scene */
[data-a=dutch] .world{animation:dutch 6s ease-in-out infinite alternate}
@keyframes dutch{from{transform:rotate(-13deg) scale(1.28)}to{transform:rotate(-13deg) scale(1.4)}}
[data-a=ots] .world{transform:translateX(-14%) scale(1.5);transform-origin:50% 40%}
.ots{position:absolute;right:-6%;bottom:-18%;width:46%;height:112%;z-index:3;filter:blur(2.5px);animation:otsb 4s ease-in-out infinite alternate}
.ots i{position:absolute;background:#141B28;border-radius:50%}
.ots i:first-child{left:22%;top:8%;width:46%;height:46%}
.ots i:last-child{left:0;top:46%;width:100%;height:80%;border-radius:48% 48% 0 0}
@keyframes otsb{from{transform:translateY(0)}to{transform:translateY(2%)}}
[data-a=pov] .world{animation:pov 1.1s ease-in-out infinite alternate}
@keyframes pov{from{transform:scale(1.18) translateY(-1.2%) rotate(-.6deg)}to{transform:scale(1.2) translateY(1.2%) rotate(.6deg)}}
.vig{position:absolute;inset:0;z-index:3;background:radial-gradient(ellipse at center,transparent 45%,rgba(8,10,18,.55) 100%)}

/* speed / lens */

.lgo{display:flex;align-items:center;gap:12px}
.lgo svg{width:60px;height:60px;overflow:visible}

.lgo path{fill:none;stroke:var(--key);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:lgp 4.2s infinite}
@keyframes lgc{0%{stroke-dashoffset:100;fill-opacity:0}24%{stroke-dashoffset:0;fill-opacity:0}34%,84%{stroke-dashoffset:0;fill-opacity:1}96%,100%{stroke-dashoffset:100;fill-opacity:0}}
@keyframes lgp{0%,20%{stroke-dashoffset:100}38%,84%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:100}}
.wm{overflow:hidden}

@property --n{syntax:'<integer>';inherits:false;initial-value:0}
.dv{display:flex;gap:22px;align-items:flex-end}
.dv .num{font:500 30px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums;counter-reset:n var(--n);animation:cnt 4.2s cubic-bezier(.2,.8,.2,1) infinite}
.dv .num::after{content:counter(n) "%"}

@keyframes cnt{0%{--n:0}45%,85%{--n:87}100%{--n:0}}
.bars{display:flex;align-items:flex-end;gap:8px;height:80px}
.bars i{width:18px;height:var(--h);border-radius:4px 4px 0 0;background:var(--accent);transform-origin:bottom;animation:bar 4.2s cubic-bezier(.2,.8,.2,1) infinite both;animation-delay:calc(var(--i) * .08s)}
.bars i:last-child{background:var(--key)}
@keyframes bar{0%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{transform:scaleY(0)}}
.prg{position:relative;width:24px;height:24px}
.prg b{position:absolute;inset:0;border-radius:50%;background:var(--accent)}
.prg i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--accent);opacity:0;animation:prg 2.4s cubic-bezier(.2,.6,.3,1) infinite}
.prg i:nth-child(2){animation-delay:.8s}.prg i:nth-child(3){animation-delay:1.6s}
@keyframes prg{0%{transform:scale(1);opacity:.9}100%{transform:scale(5.5);opacity:0}}
.shn{position:relative;overflow:hidden;padding:14px 34px;border-radius:12px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,var(--ink)));color:var(--on-accent);font:700 22px var(--f-disp);letter-spacing:.2em}
.shn::after{content:"";position:absolute;top:-50%;bottom:-50%;width:40%;left:-60%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shn 2.8s ease-in-out infinite}
@keyframes shn{0%,30%{left:-60%}70%,100%{left:130%}}

/* durations ruler (UI) */
.dur{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:8px}
.dur h3{font-size:16px;font-weight:500}
.dur p{margin:2px 0 12px;font-size:13px;color:var(--ink-2)}
.dchart{direction:ltr;display:grid;gap:7px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px;align-items:center}
.drow .lb{direction:rtl;text-align:right;font-size:12.5px;color:var(--ink);min-width:0}
.drow .lb small{display:block;color:var(--ink-3);font-size:11px}
.dtrack{position:relative;height:18px;border-radius:5px;background:var(--surface-2);background-image:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px calc(100% / 7));}
.dtrack i{position:absolute;top:3px;bottom:3px;border-radius:4px;background:var(--accent)}

.daxis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:12px}
.daxis div{position:relative;height:14px}
.daxis span{position:absolute;transform:translateX(-50%);font:500 10px var(--f-mono);color:var(--ink-3)}
.rules{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:12.5px;color:var(--ink-2)}
.rules b{font-family:var(--f-mono);font-weight:500;color:var(--accent);direction:ltr;unicode-bidi:isolate}

footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

@media (max-width:860px){
  .hero{grid-template-columns:1fr;padding-top:34px;gap:24px}
  .composer{grid-template-columns:1fr;padding:16px}
  .sec-head{grid-template-columns:1fr}
  .sec-head .toolsline{text-align:right}
}
@media (max-width:520px){
  #app{padding-inline:16px}
  .bar{margin-inline:-16px;padding-inline:16px}

const springF=x=>1-Math.exp(-6.2*x)*Math.cos(12.5*x);

const toLinear=f=>{const a=[];for(let i=0;i<=48;i++)a.push(+f(i/48).toFixed(4));a[48]=1;return 'linear('+a.join(', ')+')'};
const hasLinear=CSS.supports('animation-timing-function','linear(0, 1)');
const SPRING=hasLinear?toLinear(springF):'cubic-bezier(.34,1.56,.64,1)';

function shot(k,cx,cy,tag){
  let st=`--k:${k};`,crop='';
  if(k!==1){const ox=(cx-.5/k)/(1-1/k),oy=(cy-.5/k)/(1-1/k);st+=`--ox:${(ox*100).toFixed(2)}%;--oy:${(oy*100).toFixed(2)}%;`}

function angle(cx,cy,tag,opt={}){
  const tx=opt.tx??112,ty=opt.ty??44;const a=Math.atan2(ty-cy,tx-cx)*180/Math.PI;

  <g class="cam" transform="translate(${cx} ${cy})">${drone}<g transform="rotate(${a.toFixed(1)})"><rect x="-8" y="-4.5" width="11" height="9" rx="1.5"/><polygon points="3,-2.4 8,-4.4 8,4.4 3,2.4"/></g></g>
  <text x="6" y="87">${opt.deg||''}</text></svg></div>`;

const PANES=()=>`<div class="pa"><i class="orb"></i><i class="hill"></i><em>${t('لقطة ١','Shot 1')}</em></div><div class="pb"><i class="orb"></i><i class="hill"></i><em>${t('لقطة ٢','Shot 2')}</em></div>`;

  {en:'Video-to-Video',ar:'من فيديو إلى فيديو',d:'ترفع فيديو حقيقيًا (حتى لو من الموبايل) والأداة تعيد رسمه بأسلوب جديد مع الحفاظ على الحركة. شدة التغيير تحدد كم يبقى من الأصل.',de:'You upload a real video (even from a phone) and the tool repaints it in a new style while keeping the motion. The strength setting decides how much of the original remains.',p:'Restyle this video as a hand-painted watercolor animation, keep the original motion and timing',demo:ab('dissolve','','SOURCE → STYLE'),m:['V2V','Restyle','Denoise strength']},
 ]},
 {ar:'أدوات التحكم في الحركة',en:'Motion controls',items:[
  {en:'Motion Brush',ar:'فرشاة الحركة',d:'ترسم بالفرشاة على جزء من الصورة وتحدد اتجاه حركته فقط، والباقي يبقى ثابتًا. مفيدة للسحب والماء والشعر.',de:'You paint over part of the image and set its direction; everything else stays still. Useful for clouds, water and hair.',p:'Only the clouds drift slowly to the right, everything else stays completely still',demo:scene('brush','<div class="paint"></div><i class="brushc"></i>','BRUSH'),m:['Region motion']},
  {en:'Camera Control',ar:'التحكم في الكاميرا',d:'بعض الأدوات تعطيك منزلقات لحركة الكاميرا (أفقي، رأسي، زووم، بان، تيلت، رول) بدل كتابتها. اختر محورًا واحدًا بقيمة متوسطة لنتيجة نظيفة.',de:'Some tools give you sliders for camera motion (horizontal, vertical, zoom, pan, tilt, roll) instead of writing it. Pick one axis at a medium value for a clean result.',p:'Camera: truck left at medium intensity, no other camera movement',demo:scene('truck',`<div class="ccp"><div class="on"><span>Horiz</span><s><i></i></s><span>-5</span></div><div><span>Zoom</span><s><i></i></s><span>0</span></div><div><span>Tilt</span><s><i></i></s><span>0</span></div><div><span>Roll</span><s><i></i></s><span>0</span></div></div>`),m:['sliders','one axis']},
  {en:'Motion Strength',ar:'شدة الحركة',d:'إعداد يحدد كمية الحركة في الفيديو. القيم العالية تعطي حركة أكثر لكنها تزيد التشوه والتحول الغريب، والمنخفضة أثبت. ابدأ من المنتصف.',de:'A setting that controls how much movement the video has. High values add motion but increase warping and morphing; low values are more stable. Start in the middle.',p:'Subtle motion, gentle and minimal movement, stable scene',demo:uic(`<div class="str"><div class="lo"><span>LOW</span><s><i></i></s></div><div class="md"><span>MEDIUM</span><s><i></i></s></div><div class="hi"><span>HIGH</span><s><i></i></s></div></div>`),m:['Motion amount','Motion bucket']},
  {en:'Negative Prompt',ar:'البرومبت السلبي',d:'قائمة بما لا تريده في النتيجة. ليست كل الأدوات تدعمها؛ في هذه الحالة صِف الثبات بجمل إيجابية مثل static background.',de:'A list of what you don\'t want in the result. Not every tool supports it; when it doesn\'t, describe stability in positive phrases like "static background".',p:'Negative prompt: morphing, warping, flicker, distorted face, extra fingers, text, watermark, camera shake',demo:ui(`<div class="negb"><b>negative prompt</b>${['morphing','flicker','extra fingers','text','watermark','blurry'].map((w,i)=>`<span style="--i:${i}">${w}</span>`).join('')}</div>`),m:['what to avoid']},
  {en:'Character Reference',ar:'ثبات الشخصية',d:'رفع صورة مرجعية للشخصية أو للأسلوب لتبقى ثابتة بين اللقطات. بدونها تتغير الملامح والملابس من لقطة لأخرى.',de:'Upload a reference image of the character or style so it stays consistent across shots. Without it, faces and outfits change from shot to shot.',p:'Same character as the reference image: identical face, hairstyle and red coat, consistent across all shots',demo:ui(`<div class="cref"><div class="rf"><b>REF</b>${miniFig()}</div><span class="ar2">→</span><div class="sh2">${miniFig()}</div><div class="sh2">${miniFig()}</div><div class="sh2">${miniFig()}</div></div>`),m:['Consistency','Style ref']},
  {en:'Lip Sync',ar:'مزامنة الشفاه',d:'تحريك فم الشخصية ليطابق ملف صوت أو نصًا منطوقًا. استخدم وجهًا واضحًا من الأمام في لقطة قريبة أو متوسطة.',de:'Animates the character\'s mouth to match an audio file or spoken text. Use a clear front-facing face in a close or medium shot.',p:'Medium close-up, the character speaks directly to camera with natural lip sync, subtle head movement and blinking',demo:ui(`<div class="ls"><div class="lsf"><i class="hr"></i><i class="e l"></i><i class="e r"></i><i class="m"></i></div><div class="wave">${range(14,i=>`<i style="--i:${i}"></i>`)}</div></div>`),m:['Talking head','Audio']},
 ]},
 {ar:'الصيغة والزمن',en:'Format & time',items:[
  {en:'Aspect Ratio',ar:'نسبة الأبعاد',d:'حدّدها قبل التوليد لأن تغييرها بعد ذلك يقص الصورة. 16:9 يوتيوب، 9:16 ريلز وتيك توك، 1:1 و4:5 فيد إنستجرام، 2.39:1 سينما عريضة.',de:'Set it before generating, because changing it later crops the image. 16:9 for YouTube, 9:16 for Reels and TikTok, 1:1 and 4:5 for Instagram feed, 2.39:1 for widescreen cinema.',p:'Vertical 9:16 composition, subject centered, space for captions at the bottom',demo:ui(`<div class="ars">${[['16:9',160,90],['9:16',51,90],['1:1',90,90],['4:5',72,90],['2.39:1',190,80]].map((r,i)=>`<i style="--i:${i};width:${r[1]}px;height:${r[2]}px"><b>${r[0]}</b></i>`).join('')}</div>`),m:['16:9','9:16','1:1','4:5','2.39:1']},
  {en:'Duration & Frame Rate',ar:'المدة ومعدل الكادرات',d:'أغلب الأدوات تولّد مقاطع من 5 إلى 10 ثوانٍ، فاجعل كل مقطع حدثًا واحدًا. 24fps إحساس سينمائي، و30fps للسوشيال، و60fps للحركة الناعمة جدًا.',de:'Most tools generate 5 to 10 second clips, so make each clip one event. 24fps feels cinematic, 30fps suits social, 60fps is for very smooth motion.',p:'Single 5-second shot, one continuous action, 24fps cinematic motion',demo:ui(`<div class="film"><div class="strip">${range(12,()=>'<i></i>')}<b></b></div><span>5s × 24fps = 120 frames</span></div>`),m:['5s','10s','24fps','30fps','60fps']},
  {en:'Seed',ar:'البذرة (Seed)',d:'رقم يحدد نقطة بداية العشوائية. نفس البرومبت مع نفس الـ Seed يعطي نتيجة قريبة جدًا، فاحفظه عندما تعجبك نتيجة وغيّر كلمة واحدة فقط.',de:'A number that sets the starting point of the randomness. Same prompt plus same seed gives a very similar result, so save it when you like a take and change one word at a time.',p:'Fix the seed, then change one word at a time to compare versions',demo:ui(`<div class="seedw"><figure><div class="th">${LND}</div><figcaption>seed 4821</figcaption></figure><figure><div class="th">${LND}</div><figcaption>seed 4821</figcaption></figure><figure class="v2"><div class="th">${LND}</div><figcaption>seed 9133</figcaption></figure></div>`),m:['reproducible']},
  {en:'Extend',ar:'تمديد المقطع',d:'الأداة تكمل المقطع من آخر كادر لتصنع فيديو أطول. صف ما يحدث بعد ذلك فقط، وحافظ على الأسلوب نفسه.',de:'The tool continues the clip from its last frame to make a longer video. Describe only what happens next and keep the same style.',p:'Continue the shot: the camera keeps pushing in as she opens the door, same lighting and style',demo:uic(`<div class="ext"><div class="tl3"><span class="c1">0–5s</span><span class="c2">+5s</span></div><small><span>clip</span><span>extend</span></small></div>`),m:['continue','last frame']},
  {en:'Loop',ar:'تكرار متصل',d:'مقطع ينتهي على الكادر الذي بدأ به ليتكرر بلا قطع. بعض الأدوات فيها خيار Loop، أو استخدم الصورة نفسها كأول وآخر كادر.',de:'A clip that ends on its first frame so it repeats with no cut. Some tools have a Loop option; otherwise use the same image as first and last frame.',p:'Seamless loop, the last frame matches the first frame, continuous cyclical motion',demo:ui(`<div class="orb3"><s></s><i></i><i></i><i></i><b></b></div>`),m:['first = last']},
  {en:'Frame Interpolation',ar:'الكادرات البينية',d:'إضافة كادرات بين الكادرات الموجودة لتنعيم الحركة، أو لصنع حركة بطيئة من مقطع عادي.',de:'Adds frames between existing frames to smooth motion, or to make slow motion from a normal clip.',p:'Interpolate from 24fps to 60fps for smoother motion, or to 120fps for slow motion',demo:uic(`<div class="fpsc"><div><span>12 fps</span><s><i></i></s></div><div class="sm"><span>60 fps</span><s><i></i></s></div></div>`),m:['post','smooth']},
  {en:'Upscale',ar:'رفع الدقة',d:'تكبير الفيديو لدقة أعلى (مثلًا من 720p إلى 4K) مع إضافة تفاصيل. آخر خطوة قبل المونتاج.',de:'Enlarges the video to a higher resolution (for example 720p to 4K) while adding detail. The last step before editing.',p:'Upscale the final clip to 4K, preserve film grain, no oversharpening',demo:`<div class="demo"><span class="tag">720p → 4K</span><div class="st"><div class="bu">${LND}</div></div></div>`,m:['720p','1080p','4K']},
 ]}
]},
{id:'camera',ar:'حركات الكاميرا',en:'Camera Movement',nav:['الكاميرا','Camera'],tools:'Runway · Kling · Veo · Sora · Hailuo · Luma · Pika',
 intro:['كيف تتحرك الكاميرا داخل المشهد. انتبه للفرق بين الحركات التي تدور فيها الكاميرا في مكانها (Pan و Tilt و Zoom) والحركات التي تنتقل فيها فعليًا (Dolly و Truck و Pedestal)، لأن النوع الثاني وحده يعطي عمقًا بين القريب والبعيد.','How the camera moves through the scene. Notice the difference between moves where the camera rotates in place (Pan, Tilt, Zoom) and moves where it actually travels (Dolly, Truck, Pedestal): only the second kind creates depth between near and far.'],
 groups:[
 {ar:'الحركات الأساسية',en:'Core moves',items:[
  {en:'Pan',ar:'بان: دوران أفقي',d:'الكاميرا ثابتة في مكانها وتدور يمينًا أو يسارًا حول محورها. كل عناصر الكادر تنزلق بالسرعة نفسها، فلا يظهر عمق بين القريب والبعيد.',de:'The camera stays in place and rotates left or right. Every layer slides at the same speed, so there is no depth between near and far.',p:'Slow pan from left to right across the valley, camera fixed on a tripod, smooth cinematic motion',demo:scene('pan','','PAN'),m:['Pan left','Pan right'],cmp:'move',ph:'pan left to right'},
  {en:'Tilt',ar:'تيلت: دوران رأسي',d:'الكاميرا في مكانها وتميل لأعلى أو لأسفل. مناسبة لكشف ارتفاع مبنى أو لإظهار شخص من قدميه حتى وجهه.',de:'The camera stays in place and rotates up or down. Good for revealing a tall building or a person from feet to face.',p:'Camera tilts up slowly from the ground to reveal the subject standing on the hill, fixed position',demo:scene('tilt','','TILT'),m:['Tilt up','Tilt down'],cmp:'move',ph:'tilt up'},
  {en:'Zoom In / Out',ar:'زووم: تقريب بالعدسة',d:'تغيير البعد البؤري للعدسة دون تحريك الكاميرا. الصورة كلها تكبر بنسبة واحدة، فتبدو مسطحة مقارنة بالدوللي.',de:'The lens focal length changes while the camera stays put. The whole image scales evenly, so it looks flat compared to a dolly.',p:'Slow optical zoom in on the subject, the camera does not move, lens zoom only',demo:scene('zoom','','ZOOM'),m:['Zoom in','Zoom out'],cmp:'move',ph:'zoom in'},
  {en:'Dolly In / Out',ar:'دوللي: الكاميرا تتقدم أو ترجع',d:'الكاميرا نفسها تتحرك للأمام أو للخلف. القريب يكبر أسرع من البعيد، وهذا يعطي عمقًا حقيقيًا لا يعطيه الزووم.',de:'The camera itself moves forward or back. Near objects grow faster than far ones, which gives real depth a zoom can\'t.',p:'Slow dolly in toward the subject, the camera physically moves forward, natural parallax between foreground and background',demo:scene('dolly','','DOLLY'),m:['Push in','Pull out'],cmp:'move',ph:'dolly in'},
  {en:'Truck Left / Right',ar:'تراك: حركة جانبية',d:'الكاميرا تنتقل بالعرض موازية للمشهد. العناصر القريبة تتحرك أسرع من البعيدة (بارالاكس)، فيظهر العمق بوضوح.',de:'The camera slides sideways, parallel to the scene. Near objects pass faster than far ones (parallax), so depth reads clearly.',p:'Camera trucks left alongside the subject, lateral movement, strong parallax between layers',demo:scene('truck','','TRUCK'),m:['Truck left','Crab shot'],cmp:'move',ph:'truck left'},
  {en:'Pedestal Up / Down',ar:'بيدستال: رفع وخفض',d:'الكاميرا كلها ترتفع أو تنخفض رأسيًا وهي مستوية. تختلف عن التيلت لأن المنظور يتغير وتظهر فيها بارالاكس.',de:'The whole camera rises or lowers vertically while staying level. Unlike a tilt, the perspective changes and you get parallax.',p:'Camera pedestals up smoothly, rising vertically while staying level with the horizon',demo:scene('pedestal','','PED'),m:['Pedestal up','Pedestal down'],cmp:'move',ph:'pedestal up'},
 ]},
 {ar:'حركات سينمائية متقدمة',en:'Advanced moves',items:[
  {en:'Arc / Orbit',ar:'آرك: دوران حول الهدف',d:'الكاميرا تدور في قوس حول الشخص ويبقى هو في منتصف الكادر، بينما تتحرك الخلفية عكس اتجاه المقدمة.',de:'The camera circles the subject, who stays centered while the background moves opposite to the foreground.',p:'Camera orbits around the subject in a smooth arc, subject stays centered, background shifts behind them',demo:scene('arc','','ORBIT'),m:['Orbit','360 orbit'],cmp:'move',ph:'orbit around the subject'},
  {en:'Crane / Jib',ar:'كرين: رافعة',d:'الكاميرا ترتفع أو تهبط على ذراع رافعة، وغالبًا تميل معها لأسفل. شائعة في افتتاح المشهد أو ختامه.',de:'The camera rises or descends on a crane arm, often tilting down as it goes. Common for opening or closing a scene.',p:'Crane shot rising up and away from the subject, revealing the wide landscape below',demo:scene('crane','','CRANE'),m:['Crane up','Boom'],cmp:'move',ph:'crane up'},
  {en:'Dolly Zoom',ar:'دوللي زووم: تأثير الدوار',d:'الكاميرا ترجع للخلف وتعمل زووم للأمام في الوقت نفسه. الشخص يبقى بالحجم نفسه والخلفية تتمدد. يوحي بالصدمة أو الدوار.',de:'The camera pulls back while zooming in at the same time. The subject keeps its size while the background stretches. Signals shock or vertigo.',p:'Dolly zoom vertigo effect: the subject stays the same size while the background stretches away, tense dramatic moment',demo:scene('dollyzoom','','VERTIGO'),m:['Vertigo effect','Zolly'],cmp:'move',ph:'dolly zoom (vertigo effect)'},
  {en:'Roll',ar:'رول: دوران حول محور العدسة',d:'الكاميرا تدور حول محورها الأمامي فيدور الأفق معها. يعطي إحساسًا بالارتباك أو الطيران أو الحلم.',de:'The camera rotates around its lens axis, so the horizon spins. Feels disorienting, airborne or dreamlike.',p:'Camera slowly rolls clockwise, the horizon rotating, disorienting dreamlike motion',demo:scene('roll','','ROLL'),m:['Barrel roll'],cmp:'move',ph:'camera roll'},
  {en:'Whip Pan',ar:'ويب بان: بان خاطف',d:'بان سريع جدًا تتلطخ فيه الصورة بضبابية الحركة. يُستخدم انتقالًا بين لقطتين أو لإظهار رد فعل مفاجئ.',de:'A pan so fast the image smears with motion blur. Used as a transition or to show a sudden reaction.',p:'Fast whip pan to the right with heavy motion blur, energetic',demo:scene('whip','','WHIP'),m:['Swish pan'],cmp:'move',ph:'whip pan'},
  {en:'Crash Zoom',ar:'كراش زووم: زووم خاطف',d:'زووم سريع ومفاجئ على وجه أو تفصيلة. شائع في الكوميديا والأكشن ولحظات الإدراك المفاجئ.',de:'A sudden, fast zoom onto a face or detail. Common in comedy, action and moments of realization.',p:"Sudden crash zoom into the subject's face, fast snap zoom, comedic dramatic timing",demo:scene('crash','','SNAP'),m:['Snap zoom'],cmp:'move',ph:'crash zoom into the face'},
  {en:'Tracking Shot',ar:'تراكينج: لقطة تتبّع',d:'الكاميرا تمشي مع الشخص أثناء حركته، فيبقى ثابتًا تقريبًا في الكادر وتجري الخلفية من ورائه.',de:'The camera travels with a moving subject, who stays roughly fixed in frame while the background rushes past.',p:'Tracking shot following the subject as they walk, camera moves alongside at the same speed',demo:scene('tracking','','TRACK'),m:['Follow shot','Leading shot'],cmp:'move',ph:'tracking shot following the subject'},
  {en:'Pull-Back Reveal',ar:'كشف بالرجوع',d:'تبدأ اللقطة قريبة جدًا من تفصيلة ثم ترجع ببطء لتكشف المكان كله. تحكي قصة في لقطة واحدة.',de:'Starts very close on a detail, then slowly pulls back to reveal the whole place. A story in one shot.',p:"Starts on an extreme close-up of the subject's face, then slowly pulls back to reveal the vast landscape",demo:scene('reveal','','REVEAL'),m:['Reveal shot'],cmp:'move',ph:'pull-back reveal'},
  {en:'FPV Drone',ar:'FPV: طيران سريع داخل المشهد',d:'درون سريع يطير بين العناصر ويميل في المنعطفات. حركة ديناميكية تضع المشاهد داخل المشهد.',de:'A fast drone flies between objects and banks into turns. Dynamic and immersive.',p:'FPV drone shot flying fast and low through the scene, banking turns, immersive fly-through',demo:scene('fpv','','FPV'),m:['Fly-through'],cmp:'move',ph:'FPV drone fly-through'},
  {en:'Drone Rise',ar:'صعود جوي كاشف',d:'الدرون يرتفع من خلف عنصر قريب (شجرة أو سور) ليكشف المنظر كاملًا من أعلى.',de:'The drone rises from behind a close object (a tree, a wall) to reveal the full view from above.',p:'Aerial drone shot rising up from behind the foreground to reveal the valley and the lone figure',demo:scene('drone','','DRONE'),m:['Aerial reveal'],cmp:'move',ph:'drone rising reveal'},
  {en:'Spiral',ar:'سبايرال: دوران مع تقدّم',d:'الكاميرا تتقدم نحو الهدف وهي تدور حول محورها. حركة درامية للدخول إلى المشهد.',de:'The camera pushes toward the subject while rotating on its axis. A dramatic way into a scene.',p:'Camera spirals in toward the subject, rotating while pushing forward',demo:scene('spiral','','SPIRAL'),m:['Corkscrew'],cmp:'move',ph:'spiral in'},
  {en:'Snorricam',ar:'سنوريكام: كاميرا مثبتة على الجسم',d:'الكاميرا مربوطة بجسم الشخص، فيبقى ثابتًا تمامًا في الكادر بينما يتمايل العالم من حوله. يوحي بالتوهان.',de:'The camera is rigged to the actor\'s body, so they stay locked in frame while the world sways around them. Feels disoriented.',p:"Snorricam shot, camera rigged to the subject's body, subject locked in frame while the world sways around them",demo:scene('snorri','','BODY RIG'),m:['Body mount'],cmp:'move',ph:'snorricam body-mounted shot'},
  {en:'Turntable / 360°',ar:'دوران المنتج 360',d:'المنتج يدور حول نفسه على قاعدة والكاميرا ثابتة، أو الكاميرا تلف حوله. الأشهر في فيديوهات المنتجات.',de:'The product spins on a pedestal while the camera stays still, or the camera circles it. The most common product video move.',p:'Product turntable: the object rotates 360 degrees on a pedestal, clean studio lighting, static camera',demo:`<div class="demo"><span class="tag">360°</span><div class="st"><div class="turn"><div class="cube3"><div class="cb3"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i><i class="f6"></i></div></div><i class="base"></i></div></div></div>`,m:['Product spin'],cmp:'move',ph:'360 turntable rotation'},
 ]},
 {ar:'طريقة حمل الكاميرا',en:'Rig & stabilization',items:[
  {en:'Static / Locked-off',ar:'كاميرا ثابتة',d:'الكاميرا على حامل ثلاثي ولا تتحرك إطلاقًا، والحركة كلها من الشخص. مفيدة جدًا في أدوات الذكاء الاصطناعي لمنع حركة الكاميرا العشوائية.',de:'The camera sits on a tripod and doesn\'t move at all; all motion comes from the subject. Very useful in AI tools to stop random camera drift.',p:'Static locked-off shot on a tripod, no camera movement, only the subject walks across the frame',demo:scene('static','','LOCKED'),m:['Tripod shot'],cmp:'move',ph:'static locked-off camera'},
  {en:'Handheld',ar:'كاميرا محمولة باليد',d:'اهتزاز طبيعي خفيف كأن شخصًا يحمل الكاميرا بيده. يمنح واقعية وتوترًا، ويناسب الأسلوب الوثائقي.',de:'A light natural shake, as if someone is holding the camera. Adds realism and tension; suits documentary style.',p:'Handheld camera with subtle natural shake, documentary style, raw and intimate',demo:scene('handheld','','HANDHELD'),m:['Shaky cam'],cmp:'move',ph:'handheld'},
  {en:'Steadicam / Gimbal',ar:'حركة ناعمة طافية',d:'الكاميرا تتحرك بحرية ولكن بنعومة كاملة كأنها تطفو، دون أي اهتزاز.',de:'The camera moves freely but perfectly smoothly, as if floating, with no shake.',p:'Smooth steadicam shot gliding forward toward the subject, floating gimbal movement, no shake',demo:scene('gimbal','','GIMBAL'),m:['Gimbal'],cmp:'move',ph:'smooth steadicam glide'},
 ]}
]},
{id:'shots',ar:'اللقطات والزوايا والتكوين',en:'Shots, Angles & Composition',nav:['اللقطات','Shots'],tools:'Midjourney · Runway · Kling · Veo · Sora',
 intro:['حجم اللقطة يحدد كم نرى من الشخص، والزاوية تحدد من أين ننظر إليه، والتكوين يحدد أين يقع داخل الكادر. الإطار المتقطع في الأمثلة يوضح أين تقع اللقطة من المشهد الواسع.','Shot size decides how much of the person we see, angle decides where we look from, and composition decides where they sit in the frame. The dashed box in the examples shows where the shot sits inside the wide scene.'],
 groups:[
 {ar:'أحجام اللقطات',en:'Shot sizes',items:[
  {en:'Extreme Wide Shot',ar:'لقطة واسعة جدًا',d:'المكان هو البطل والشخص صغير جدًا فيه. تُستخدم لتعريف المكان في بداية المشهد.',de:'The place is the hero and the person is tiny inside it. Used to establish location at the start of a scene.',p:'Extreme wide shot of a tiny lone figure in a vast mountain valley, establishing shot',demo:shot(.72,.5,.5,'EWS'),m:['EWS','Establishing'],cmp:'shot',ph:'extreme wide shot'},
  {en:'Wide / Long Shot',ar:'لقطة واسعة',d:'الشخص كاملًا ومعه مساحة كبيرة من المكان حوله. توازن بين الشخص وبيئته.',de:'The whole person plus a lot of their surroundings. Balances character and environment.',p:'Wide shot of a person standing on a hill, full body with plenty of surrounding landscape',demo:shot(1,.5,.5,'WS'),m:['WS','LS'],cmp:'shot',ph:'wide shot'},
  {en:'Full Shot',ar:'لقطة كاملة',d:'الشخص من رأسه إلى قدميه يملأ الكادر تقريبًا. تُظهر لغة الجسد والملابس.',de:'Head to toe, nearly filling the frame. Shows body language and wardrobe.',p:'Full shot of the person, head to toe filling the frame',demo:shot(1.35,.5,.585,'FS'),m:['FS'],cmp:'shot',ph:'full shot'},
  {en:'Medium Wide / Cowboy',ar:'لقطة متوسطة واسعة',d:'من منتصف الفخذ إلى أعلى. سُميت Cowboy لأنها كانت تُظهر المسدس على جانب الخصر في أفلام الغرب.',de:'From mid-thigh up. Called the cowboy shot because it showed the holster in westerns.',p:'Medium wide cowboy shot framed from mid-thigh up',demo:shot(1.8,.5,.5,'MWS'),m:['MWS','American shot'],cmp:'shot',ph:'medium wide shot'},
  {en:'Medium Shot',ar:'لقطة متوسطة',d:'من الخصر إلى أعلى. أشهر لقطة للحوار لأنها تجمع تعبير الوجه وحركة اليدين.',de:'Waist up. The most common dialogue framing: face plus hand gestures.',p:'Medium shot from the waist up, natural conversational framing',demo:shot(2.2,.5,.46,'MS'),m:['MS'],cmp:'shot',ph:'medium shot'},
  {en:'Medium Close-Up',ar:'لقطة متوسطة قريبة',d:'من الصدر إلى أعلى. توازن بين تعبير الوجه وقليل من السياق.',de:'Chest up. Balances facial expression with a bit of context.',p:'Medium close-up from the chest up, focus on facial expression',demo:shot(3,.5,.4,'MCU'),m:['MCU'],cmp:'shot',ph:'medium close-up'},
  {en:'Close-Up',ar:'لقطة قريبة',d:'الوجه يملأ الكادر. للمشاعر وردود الفعل.',de:'The face fills the frame. For emotion and reactions.',p:'Close-up of the face filling the frame, emotional, soft natural light',demo:shot(4.5,.5,.355,'CU'),m:['CU'],cmp:'shot',ph:'close-up'},
  {en:'Extreme Close-Up',ar:'لقطة قريبة جدًا',d:'تفصيلة واحدة فقط: عين أو شفاه أو يد على زر. قوية لبناء التوتر.',de:'A single detail: an eye, lips, a finger on a button. Great for building tension.',p:'Extreme close-up of an eye, macro detail, reflections in the iris',demo:shot(11,.485,.356,'ECU'),m:['ECU','Macro'],cmp:'shot',ph:'extreme close-up'},
 ]},
 {ar:'زوايا الكاميرا',en:'Camera angles',items:[
  {en:'Eye Level',ar:'مستوى العين',d:'الكاميرا على ارتفاع عين الشخص. زاوية محايدة وطبيعية لا تحمل حكمًا عليه.',de:'Camera at the subject\'s eye height. Neutral and natural; passes no judgment.',p:'Eye-level shot of the subject, neutral natural perspective',demo:angle(38,44,'EYE LEVEL',{deg:'0°'}),m:['Neutral'],cmp:'angle',ph:'eye-level shot'},
  {en:'High Angle',ar:'زاوية عالية',d:'الكاميرا أعلى من الشخص وتنظر إليه لأسفل. يبدو أصغر وأضعف.',de:'Camera above the subject looking down. They look smaller and weaker.',p:'High angle shot looking down at the subject, making them look small and vulnerable',demo:angle(50,12,'HIGH',{deg:'-30°'}),m:['Looking down'],cmp:'angle',ph:'high angle'},
  {en:'Low Angle',ar:'زاوية منخفضة',d:'الكاميرا أسفل الشخص وتنظر إليه لأعلى. يبدو قويًا ومسيطرًا وبطوليًا.',de:'Camera below the subject looking up. They look strong, dominant, heroic.',p:'Low angle shot looking up at the subject, heroic and powerful',demo:angle(50,72,'LOW',{deg:'+30°'}),m:['Hero angle'],cmp:'angle',ph:'low angle'},
  {en:"Bird's-Eye / Top-Down",ar:'عين الطائر',d:'الكاميرا فوق الشخص عموديًا تمامًا. تعطي تكوينًا جرافيكيًا يشبه الخريطة.',de:'Camera directly overhead, looking straight down. A graphic, map-like composition.',p:"Overhead bird's-eye view, camera looking straight down, graphic top-down composition",demo:angle(112,8,'OVERHEAD',{deg:'-90°',ty:38}),m:['Overhead','Flat lay'],cmp:'angle',ph:"top-down bird's-eye view"},
  {en:"Worm's-Eye View",ar:'عين الدودة',d:'الكاميرا على الأرض تقريبًا وتنظر لأعلى بزاوية حادة جدًا. تضخّم الحجم والارتفاع.',de:'Camera almost on the ground looking steeply up. Exaggerates size and height.',p:"Worm's-eye view from ground level looking steeply up at the subject",demo:angle(84,76,'WORM',{deg:'+60°'}),m:['Ground level'],cmp:'angle',ph:"worm's-eye view"},
  {en:'Aerial Shot',ar:'لقطة جوية',d:'من طائرة أو درون على ارتفاع كبير. تغطي مساحة واسعة وتُظهر الحجم الحقيقي للمكان.',de:'From a plane or drone at great height. Covers a huge area and shows real scale.',p:'Aerial shot from high altitude, drone view gliding over the landscape',demo:angle(30,10,'AERIAL',{drone:true,deg:'drone'}),m:['Drone view'],cmp:'angle',ph:'aerial view'},
  {en:'Dutch Angle',ar:'زاوية مائلة',d:'الأفق مائل عمدًا. توحي بعدم الاتزان أو الخطر أو اضطراب الشخصية.',de:'The horizon is deliberately tilted. Suggests imbalance, danger or a troubled mind.',p:'Dutch angle, tilted horizon, uneasy tense atmosphere',demo:scene('dutch','','DUTCH'),m:['Canted angle'],cmp:'angle',ph:'dutch angle'},
  {en:'Over-the-Shoulder',ar:'من فوق الكتف',d:'الكاميرا خلف كتف شخص وتنظر إلى من أمامه. أساسية في مشاهد الحوار.',de:'Camera behind one person\'s shoulder, looking at whoever faces them. Essential in dialogue.',p:'Over-the-shoulder shot from behind one character looking at the other',demo:scene('ots','<div class="ots"><i></i><i></i></div>','OTS'),m:['OTS'],cmp:'angle',ph:'over-the-shoulder'},
  {en:'POV / First Person',ar:'من عين الشخصية',d:'الكاميرا هي عين الشخصية، فيرى المشاهد ما تراه هي. تزيد الانغماس والتقمص.',de:'The camera is the character\'s eyes; the viewer sees what they see. Increases immersion.',p:"First-person POV shot, we see through the character's eyes as they walk",demo:scene('pov','<div class="vig"></div>','POV'),m:['Point of view'],cmp:'angle',ph:'first-person POV'},
 ]},
 {ar:'التكوين',en:'Composition',items:[
  {en:'Rule of Thirds',ar:'قاعدة الأثلاث',d:'قسّم الكادر بخطين أفقيين وخطين رأسيين وضع الموضوع على أحد التقاطعات. أكثر حيوية من المنتصف.',de:'Divide the frame with two horizontal and two vertical lines and place the subject on an intersection. Livelier than dead center.',p:'Subject placed on the left third of the frame, rule of thirds composition',demo:scene('thirds','<div class="g3"><b style="left:33.33%;top:33.33%"></b><b style="left:66.66%;top:33.33%"></b><b style="left:33.33%;top:66.66%"></b><b style="left:66.66%;top:66.66%"></b></div>','THIRDS'),m:['3×3 grid']},
  {en:'Center / Symmetry',ar:'المركز والتماثل',d:'الموضوع في المنتصف تمامًا مع توازن الجانبين. قوي ومباشر، ويناسب اللقطات الرسمية والمنتجات.',de:'The subject dead center with balanced sides. Strong and direct; suits formal shots and products.',p:'Perfectly symmetrical centered composition, subject in the exact middle',demo:scene('breathe','<div class="gc"></div>','CENTER'),m:['Symmetry']},
  {en:'Leading Lines',ar:'الخطوط الموجِّهة',d:'خطوط في المشهد (طريق أو سور أو نهر) تقود عين المشاهد نحو الموضوع.',de:'Lines in the scene (a road, fence or river) that lead the viewer\'s eye to the subject.',p:'The winding path forms leading lines that guide the eye toward the subject',demo:scene('breathe','<svg class="ovsvg" viewBox="0 0 160 90" preserveAspectRatio="none"><path class="ll" d="M0 90L78 52M160 90L82 52M20 90L79 54M140 90L81 54"/></svg>','LINES'),m:['Vanishing point']},
  {en:'Headroom & Lead Room',ar:'مساحة الرأس والنظر',d:'مسافة مناسبة فوق الرأس، ومساحة أكبر في الاتجاه الذي ينظر إليه الشخص أو يتحرك نحوه.',de:'Comfortable space above the head, and more space in the direction the person looks or moves.',p:'Comfortable headroom, extra lead room on the side she is facing',demo:scene('headroom','<svg class="ovsvg" viewBox="0 0 160 90" preserveAspectRatio="none"><rect class="hb" x="40" y="2" width="36" height="14"/><rect class="hb" x="78" y="20" width="78" height="50"/><text x="44" y="11">HEAD</text><text x="100" y="47">LEAD ROOM →</text></svg>','ROOM'),m:['Looking room']},
  {en:'Negative Space',ar:'المساحة الفارغة',d:'مساحة واسعة فارغة حول موضوع صغير. توحي بالوحدة أو الهدوء، وتترك مكانًا للنص.',de:'Wide empty space around a small subject. Suggests solitude or calm and leaves room for text.',p:'Minimal composition with large negative space, small figure in the corner, room for text',demo:scene('negspace','','SPACE'),m:['Minimal']},
  {en:'Frame Within a Frame',ar:'إطار داخل إطار',d:'باب أو نافذة أو أغصان تؤطّر الموضوع. يضيف عمقًا ويركّز النظر.',de:'A door, window or branches frame the subject. Adds depth and focuses attention.',p:'The subject framed through a dark stone archway, frame within a frame',demo:scene('framed','<div class="frame2"></div>','FRAMED'),m:['Natural frame']},
 ]}
]},
{id:'subject',ar:'حركة الموضوع والبيئة',en:'Subject & Ambient Motion',nav:['حركة الموضوع','Subject'],tools:'Runway · Kling · Veo · Sora · Hailuo',
 intro:['الكاميرا نصف الحركة فقط. النصف الآخر هو ما يتحرك داخل الكادر: الشخص نفسه، والعناصر حوله. صِف حركة الموضوع بفعل واضح في جملة منفصلة عن حركة الكاميرا.','The camera is only half the motion. The other half is what moves inside the frame: the person and the world around them. Describe subject motion with a clear verb, in a separate sentence from the camera move.'],
 groups:[
 {ar:'حركة الشخصية',en:'Character motion',items:[
  {en:'Walk',ar:'المشي',d:'حدّد الاتجاه والسرعة: toward the camera أو from left to right، و slowly أو briskly.',de:'State the direction and pace: toward the camera or from left to right, slowly or briskly.',p:'The woman walks slowly from left to right across the frame, natural gait, static camera',demo:scene('walk','','WALK'),m:['direction','pace'],cmp:'act',ph:'walks slowly from left to right'},
  {en:'Run',ar:'الجري',d:'حركة سريعة تتحرك معها الخلفية أو الكاميرا. أضف تفاصيل الجسم مثل حركة الذراعين.',de:'Fast motion, usually with the background or camera moving too. Add body detail like arm swing.',p:'The man sprints toward the camera, arms pumping, dust kicking up behind him',demo:scene('run','','RUN'),m:['sprint','jog'],cmp:'act',ph:'runs toward the camera'},
  {en:'Head Turn / Look at Camera',ar:'التفات الرأس',d:'الشخص يلتفت أو ينظر مباشرة إلى الكاميرا. لحظة قوية في الإعلانات والافتتاحيات.',de:'The person turns or looks straight into the lens. A strong moment in ads and openings.',p:'She slowly turns her head and looks directly into the camera, subtle smile',demo:scene('headturn','','LOOK','zoomface'),m:['eye contact'],cmp:'act',ph:'slowly turns her head and looks into the camera'},
  {en:'Hair & Cloth in Wind',ar:'الشعر والقماش مع الهواء',d:'حركة ثانوية تعطي حياة لشخص واقف. من أسهل الحركات وأنجحها في الأدوات.',de:'Secondary motion that brings a standing person to life. One of the easiest and most reliable moves for AI tools.',p:'Her hair and coat flutter gently in the wind as she stands still',demo:scene('hairwind','<div class="windl"><i></i><i></i><i></i></div>','WIND','zoommid'),m:['secondary motion'],cmp:'act',ph:'hair and coat flutter in the wind'},
  {en:'Gesture / Wave',ar:'إيماءة اليد',d:'حركة يد واضحة ومحددة. اجعلها بسيطة وبطيئة لتقليل مشاكل الأصابع.',de:'A clear, specific hand movement. Keep it simple and slow to reduce finger problems.',p:'He raises his hand and waves at the camera in a friendly way',demo:scene('wave','','WAVE','zoommid'),m:['hands'],cmp:'act',ph:'raises a hand and waves'},
  {en:'Idle / Breathing',ar:'السكون الحي',d:'حركة خفيفة جدًا وهو واقف: تنفس ورمش وتمايل بسيط. تمنع إحساس الصورة الجامدة.',de:'Very light motion while standing: breathing, blinking, a slight sway. Prevents the frozen-photo feel.',p:'The character stands still, breathing gently, blinking naturally, subtle idle movement',demo:scene('breathe','','IDLE','zoommid'),m:['subtle','alive'],cmp:'act',ph:'stands still, breathing gently and blinking'},
 ]},
 {ar:'حركة البيئة والطقس',en:'Ambient & weather',items:[
  {en:'Wind in Trees',ar:'الرياح في الأشجار',d:'الأشجار والعشب يتمايلون والسحب تتحرك. يضيف حياة للمشهد كله.',de:'Trees and grass sway and clouds move. Brings the whole scene to life.',p:'Trees and tall grass sway in a strong breeze, clouds moving fast',demo:scene('wind','','WIND'),m:['sway'],cmp:'amb',ph:'trees swaying in the breeze'},
  {en:'Rain',ar:'مطر',d:'قطرات مائلة ومشهد أغمق وانعكاسات مبللة. حدّد الشدة: light drizzle أو heavy rain.',de:'Slanted drops, a darker scene and wet reflections. Specify intensity: light drizzle or heavy rain.',p:'Heavy rain falling, raindrops streaking, wet reflections, moody atmosphere',demo:scene('rain',drops(40,'rain',1,.6),'RAIN'),m:['drizzle','storm'],cmp:'amb',ph:'heavy rain falling'},
  {en:'Snow',ar:'ثلج',d:'ندف تسقط ببطء وتتمايل. هادئ وحالم.',de:'Flakes fall slowly and drift. Calm and dreamy.',p:'Soft snowflakes falling slowly, quiet winter scene',demo:scene('snow',drops(36,'snow',5,6),'SNOW'),m:['snowfall'],cmp:'amb',ph:'soft snow falling'},
  {en:'Fog / Mist',ar:'ضباب',d:'طبقات ضباب تنساب ببطء بين العناصر. يضيف عمقًا وغموضًا.',de:'Layers of fog slowly drift between elements. Adds depth and mystery.',p:'Low fog drifting slowly across the valley',demo:scene('fog','<div class="fx fog"><i></i><i></i><i></i></div>','FOG'),m:['haze','mist'],cmp:'amb',ph:'low fog drifting'},
  {en:'Water & Ripples',ar:'ماء وتموجات',d:'سطح الماء يتموج ويلمع بانعكاس الضوء. من أجمل الحركات المحيطة وأسهلها.',de:'The water surface ripples and sparkles with reflected light. One of the prettiest and easiest ambient moves.',p:'Gentle ripples on the lake surface, sparkling sun reflections',demo:scene('water',`<div class="lake"><b></b>${range(9,i=>`<i style="left:${(8+rnd(i+20)*80).toFixed(0)}%;top:${(12+i*9)}%;width:${(20+rnd(i)*40).toFixed(0)}px;animation-delay:-${(rnd(i*3)*2).toFixed(2)}s"></i>`)}</div>`,'WATER'),m:['reflections'],cmp:'amb',ph:'gentle ripples on the water'},
  {en:'Fire & Flames',ar:'نار',d:'لهب يرتعش وشرر يصعد وضوء دافئ يتراقص على الوجوه.',de:'Flickering flames, rising embers and warm light dancing on faces.',p:'Campfire flames flickering, embers rising, warm light dancing on faces',demo:ui(`<div class="firew"><i class="glow"></i><i class="log a"></i><i class="log b"></i><i class="fl f1"></i><i class="fl f2"></i><i class="fl f3"></i>${range(5,i=>`<i class="em" style="--dx:${(rnd(i)*40-20).toFixed(0)}px;animation-delay:-${(i*.35).toFixed(2)}s"></i>`)}</div>`),m:['embers','flicker'],cmp:'amb',ph:'flames flickering, embers rising'},
  {en:'Smoke & Steam',ar:'دخان وبخار',d:'بخار أو دخان يصعد ويتمدد ويتلاشى. تفصيلة صغيرة تجعل اللقطة حية.',de:'Steam or smoke rises, spreads and fades. A small detail that makes a shot feel alive.',p:'Steam rising slowly from a hot cup of coffee, soft backlight',demo:ui(`<div class="cup"><i class="pl2"></i><div class="c"></div>${range(5,i=>`<i class="st2" style="--dx:${(rnd(i+2)*30-15).toFixed(0)}px;animation-delay:-${(i*.6).toFixed(1)}s"></i>`)}</div>`),m:['vapor'],cmp:'amb',ph:'steam rising slowly'},
  {en:'Dust & Particles',ar:'غبار وجزيئات',d:'ذرات صغيرة تطفو في شعاع ضوء. تعطي عمقًا وإحساسًا سينمائيًا.',de:'Tiny specks floating in a beam of light. Adds depth and a cinematic feel.',p:'Dust particles floating in a beam of sunlight',demo:scene('volumetric','<div class="rays"></div>'+motes(16),'DUST'),m:['motes'],cmp:'amb',ph:'dust particles floating in the light'},
  {en:'Falling Leaves',ar:'أوراق تتساقط',d:'أوراق تسقط وتدور مع الهواء. توحي بالخريف أو مرور الوقت.',de:'Leaves fall and spin in the wind. Suggests autumn or time passing.',p:'Autumn leaves falling and spinning in the wind',demo:scene('wind',drops(12,'leaves',9,5),'LEAVES'),m:['autumn'],cmp:'amb',ph:'autumn leaves falling'},
  {en:'Light Flicker / Neon',ar:'وميض الإضاءة',d:'لافتة نيون أو لمبة ترتعش وتنطفئ وتضيء. تضيف توترًا أو طابعًا ليليًا.',de:'A neon sign or bulb buzzes, dies and comes back. Adds tension or a nighttime vibe.',p:'Neon sign buzzing and flickering on and off at night',demo:`<div class="demo neonst"><div class="st"><div class="neon">${t('مفتوح','OPEN')}</div></div></div>`,m:['buzz'],cmp:'amb',ph:'neon sign flickering'},
  {en:'Cinemagraph',ar:'سينماجراف',d:'صورة ثابتة يتحرك فيها عنصر واحد فقط في حلقة متصلة، مثل السحب أو البخار. مذهلة للإعلانات والخلفيات.',de:'A still image where only one element moves in a seamless loop, like clouds or steam. Striking for ads and backgrounds.',p:'Cinemagraph: completely still image, only the clouds move in a seamless loop',demo:scene('cinema','','CINEMAGRAPH'),m:['one element moves'],cmp:'amb',ph:'cinemagraph, only the clouds move'},
 ]}
]},
{id:'light',ar:'الإضاءة والجو',en:'Lighting & Atmosphere',nav:['الإضاءة','Lighting'],tools:'Runway · Kling · Veo · Sora · Midjourney',
 intro:['الإضاءة تغيّر إحساس الحركة نفسها: نفس الـ Dolly في الساعة الذهبية غيره في ليل ممطر. أضف كلمة إضاءة واحدة واضحة لكل لقطة.','Lighting changes how the same motion feels: a dolly at golden hour is not the same dolly on a rainy night. Add one clear lighting phrase per shot.'],
 groups:[
 {ar:'الوقت والإضاءة',en:'Time of day & light',items:[
  {en:'Golden Hour',ar:'الساعة الذهبية',d:'ضوء الشمس المنخفض قبل الغروب أو بعد الشروق: دافئ وناعم وظلال طويلة.',de:'Low sun just before sunset or after sunrise: warm, soft, long shadows.',p:'Golden hour light, warm low sun, long soft shadows',demo:scene('golden','<div class="tint"></div>','GOLDEN'),m:['warm'],cmp:'light',ph:'golden hour light'},
  {en:'Blue Hour',ar:'الساعة الزرقاء',d:'بعد الغروب مباشرة: سماء زرقاء عميقة وضوء بارد هادئ.',de:'Right after sunset: deep blue sky and cool, calm light.',p:'Blue hour, deep blue sky just after sunset, cool calm light',demo:scene('bluehour','<div class="tint"></div>','BLUE HOUR'),m:['cool'],cmp:'light',ph:'blue hour'},
  {en:'Night / Moonlight',ar:'ليل وضوء قمر',d:'إضاءة خافتة زرقاء من القمر. صِف مصدر الضوء حتى لا تصبح الصورة مظلمة تمامًا.',de:'Dim blue moonlight. Name the light source so the image doesn\'t go fully black.',p:'Night scene lit by moonlight, cool blue tones, stars in the sky',demo:scene('night','<div class="tint"></div>'+stars,'NIGHT'),m:['moonlit'],cmp:'light',ph:'moonlit night'},
  {en:'Backlight / Silhouette',ar:'إضاءة خلفية وظل',d:'مصدر الضوء خلف الشخص فيظهر كظل داكن على خلفية مضيئة. درامي وغامض.',de:'The light is behind the person, who becomes a dark shape against a bright background. Dramatic and mysterious.',p:'Strong backlight, the figure becomes a dark silhouette against the bright sky',demo:scene('silhouette','<div class="tint"></div>','BACKLIT'),m:['rim','contre-jour'],cmp:'light',ph:'strong backlight, silhouette'},
  {en:'Low-Key / Chiaroscuro',ar:'إضاءة درامية منخفضة',d:'معظم الكادر مظلم وضوء واحد مركّز على الشخص. تباين عالٍ وتوتر.',de:'Most of the frame is dark with one focused light on the subject. High contrast and tension.',p:'Low-key lighting, single hard light on the subject, deep shadows, high contrast',demo:scene('lowkey','<div class="tint"></div>','LOW-KEY'),m:['noir'],cmp:'light',ph:'low-key dramatic lighting'},
  {en:'Volumetric / God Rays',ar:'أشعة الضوء الحجمية',d:'أشعة ضوء مرئية تمر عبر الغبار أو الضباب. تعطي عمقًا وإحساسًا روحانيًا.',de:'Visible beams of light passing through dust or haze. Adds depth and an almost spiritual feel.',p:'Volumetric god rays streaming through the haze, floating dust',demo:scene('volumetric','<div class="rays"></div>'+motes(10),'RAYS'),m:['light shafts'],cmp:'light',ph:'volumetric god rays'},
  {en:'Overcast / Soft Light',ar:'ضوء غائم ناعم',d:'غيوم تغطي الشمس فيصبح الضوء منتشرًا بلا ظلال قوية. هادئ وأحيانًا حزين.',de:'Clouds cover the sun, so light is diffused with no hard shadows. Calm, sometimes melancholic.',p:'Overcast sky, soft diffused light, muted colors, no hard shadows',demo:scene('overcast','<div class="tint"></div>','OVERCAST'),m:['diffused'],cmp:'light',ph:'soft overcast light'},
  {en:'Neon / Cyberpunk',ar:'نيون',d:'ألوان وردية وزرقاء متوهجة وتباين عالٍ. طابع مدينة ليلية مستقبلية.',de:'Glowing magenta and cyan with high contrast. A futuristic night-city look.',p:'Neon lighting, magenta and cyan glow, cyberpunk night mood',demo:scene('neonl','<div class="tint"></div>','NEON'),m:['synthwave'],cmp:'light',ph:'neon magenta and cyan lighting'},
  {en:'Lightning Flash',ar:'برق',d:'ومضات ضوء مفاجئة في مشهد مظلم. حركة ضوئية تضيف توترًا.',de:'Sudden flashes in a dark scene. Light as motion, adding tension.',p:'Stormy night, lightning flashes briefly illuminate the landscape',demo:scene('lightning','<div class="tint"></div>'+drops(24,'rain',3,.6),'STORM'),m:['storm'],cmp:'light',ph:'lightning flashes in a storm'},
 ]}
]},
{id:'time',ar:'السرعة والزمن والعدسة',en:'Speed, Time & Lens',nav:['السرعة والعدسة','Speed & lens'],tools:'Runway · Kling · Veo · Sora · Premiere · DaVinci',
 intro:['التحكم في الزمن داخل اللقطة (أبطأ أو أسرع أو متجمد) وفي ما تراه العدسة واضحًا. هذه الكلمات تغيّر إحساس اللقطة أكثر من أي وصف آخر.','Control time inside the shot (slower, faster, frozen) and what the lens keeps sharp. These words change the feel of a shot more than any other description.'],
 groups:[
 {ar:'السرعة والزمن',en:'Speed & time',items:[
  {en:'Real Time',ar:'سرعة طبيعية',d:'الحركة كما تحدث في الواقع. تُصور عادة بمعدل 24 أو 30 كادرًا في الثانية.',de:'Motion as it happens in reality, usually shot at 24 or 30 frames per second.',p:'Real-time speed, natural motion, 24fps',demo:scene('realtime','','24 FPS'),m:['24fps'],cmp:'speed',ph:'real-time speed'},
  {en:'Slow Motion',ar:'حركة بطيئة',d:'تصوير بمعدل كادرات عالٍ (60 إلى 240) وعرضه بالمعدل العادي، فتبطؤ الحركة. للحظات الدرامية والتفاصيل.',de:'Shot at a high frame rate (60–240 fps) and played back at normal rate, so motion slows. For drama and detail.',p:'Slow motion at 120fps, every detail of the movement visible',demo:scene('slowmo','','120 FPS'),m:['Slo-mo'],cmp:'speed',ph:'slow motion, 120fps'},
  {en:'Time-lapse',ar:'تايم لابس',d:'كاميرا ثابتة تلتقط صورة كل فترة، فتتحول الساعات إلى ثوانٍ: سحب تجري، وشمس تغيب، وزحام يتدفق.',de:'A static camera takes a frame every few seconds, turning hours into seconds: racing clouds, sunsets, flowing crowds.',p:'Time-lapse from day to night, clouds racing across the sky, static camera',demo:scene('timelapse','','TIMELAPSE'),m:['Day to night'],cmp:'speed',ph:'time-lapse'},
  {en:'Hyperlapse',ar:'هايبرلابس',d:'تايم لابس والكاميرا نفسها تتحرك مسافة كبيرة. يعطي إحساس السفر السريع عبر المكان.',de:'A time-lapse where the camera itself travels a long distance. Feels like fast travel through a place.',p:'Hyperlapse moving through the landscape, fast forward travel',demo:scene('hyperlapse','','HYPERLAPSE'),m:['Moving time-lapse'],cmp:'speed',ph:'hyperlapse'},
  {en:'Speed Ramp',ar:'تغيير السرعة داخل اللقطة',d:'السرعة تتغير داخل اللقطة نفسها: سريع ثم بطيء ثم سريع. شائع في الأكشن والرياضة وإعلانات المنتجات.',de:'Speed changes within the same shot: fast, then slow, then fast. Common in action, sports and product ads.',p:'Speed ramp: fast motion easing into dramatic slow motion at the peak moment, then speeding up again',demo:scene('ramp','','RAMP'),m:['Time remapping'],cmp:'speed',ph:'speed ramp'},
  {en:'Freeze Frame',ar:'تجميد الكادر',d:'الحركة تتوقف تمامًا على كادر واحد ثم تكمل. لإبراز لحظة أو تقديم شخصية.',de:'Motion stops on a single frame, then continues. Highlights a moment or introduces a character.',p:'The action freezes in a still frame at the peak moment, then continues',demo:scene('freeze','<div class="flash"></div>','FREEZE'),m:['Still frame'],cmp:'speed',ph:'freeze frame'},
  {en:'Reverse Motion',ar:'حركة عكسية',d:'الحدث يُعرض من النهاية إلى البداية. مفيد للتأثيرات السحرية أو الغريبة.',de:'The action plays from end to start. Good for magical or uncanny effects.',p:'Reverse motion, the action plays backwards',demo:scene('reverse','','◀◀ REV'),m:['Rewind'],cmp:'speed',ph:'reverse motion'},
  {en:'Stop Motion',ar:'ستوب موشن',d:'حركة متقطعة كادرًا بكادر كأنها صلصال أو دمى. إحساس يدوي دافئ.',de:'Choppy frame-by-frame motion like clay or puppets. A warm handmade feel.',p:'Stop-motion animation style, choppy frame-by-frame movement, handmade feel',demo:scene('stopmotion','','12 FPS'),m:['Claymation'],cmp:'speed',ph:'stop-motion style'},
  {en:'Bullet Time',ar:'بوليت تايم',d:'الزمن شبه متجمد والكاميرا تدور حول اللحظة. اشتهر في أفلام الأكشن أواخر التسعينيات.',de:'Time is almost frozen while the camera circles the moment. Made famous by late-90s action films.',p:'Bullet time: time frozen mid-jump while the camera orbits around the subject',demo:scene('bullet','','BULLET'),m:['Frozen orbit'],cmp:'speed',ph:'bullet time'},
 ]},
 {ar:'العدسة والفوكس',en:'Lens & focus',items:[
  {en:'Rack Focus',ar:'تحويل الفوكس',d:'الفوكس ينتقل من عنصر قريب إلى عنصر بعيد أو العكس، ليوجّه انتباه المشاهد.',de:'Focus shifts from a near object to a far one (or back) to steer the viewer\'s attention.',p:'Rack focus from the foreground plant to the person in the background',demo:scene('rack','','RACK'),m:['Focus pull'],cmp:'lens',ph:'rack focus'},
  {en:'Shallow Depth of Field',ar:'عمق ميدان ضحل',d:'الشخص حاد والخلفية ناعمة ومغبشة (بوكيه). يعزل الموضوع ويعطي إحساسًا سينمائيًا.',de:'Subject sharp, background soft and blurred (bokeh). Isolates the subject and feels cinematic.',p:'Shallow depth of field, subject sharp, background soft creamy bokeh, 85mm f/1.4',demo:scene('shallow','<div class="bokeh"></div>','f/1.4'),m:['Bokeh'],cmp:'lens',ph:'shallow depth of field, creamy bokeh'},
  {en:'Deep Focus',ar:'فوكس عميق',d:'كل شيء حاد من المقدمة إلى الخلفية. يسمح للمشاهد بقراءة المشهد كاملًا.',de:'Everything sharp from foreground to background. Lets the viewer read the whole scene.',p:'Deep focus, everything sharp from foreground to background',demo:scene('deep','','f/11'),m:['All in focus'],cmp:'lens',ph:'deep focus'},
  {en:'Tilt-Shift',ar:'تأثير المجسم المصغر',d:'شريط رفيع حاد والباقي مغبش مع ألوان مشبعة، فيبدو المكان الحقيقي كأنه مجسم صغير.',de:'A narrow sharp band with the rest blurred and colors boosted, so a real place looks like a miniature model.',p:'Tilt-shift miniature effect, narrow band of focus, saturated colors, the scene looks like a tiny model',demo:scene('tiltshift','<div class="ts t"></div><div class="ts b"></div>','TILT-SHIFT'),m:['Miniature'],cmp:'lens',ph:'tilt-shift miniature effect'},
  {en:'Lens Flare',ar:'وهج العدسة',d:'خطوط وبقع ضوء تظهر عندما يدخل مصدر ضوء قوي العدسة. الخط الأفقي الأزرق علامة العدسات الأنامورفيك.',de:'Streaks and spots of light when a strong source hits the lens. The blue horizontal streak is the anamorphic signature.',p:'Warm anamorphic lens flare as the sun crosses the frame',demo:scene('flare','<div class="flr"><i></i><i></i><i></i><i></i></div>','FLARE'),m:['Anamorphic'],cmp:'lens',ph:'anamorphic lens flare'},
 ]}
]},
{id:'cuts',ar:'الانتقالات والمونتاج',en:'Transitions & Editing',nav:['الانتقالات','Transitions'],tools:'Premiere · DaVinci · CapCut · Runway · Kling',
 intro:['الطريقة التي ننتقل بها من لقطة إلى أخرى. في أدوات التوليد تستطيع طلب الانتقال داخل البرومبت، أو إعطاء الأداة الكادر الأول والأخير لتصنع الانتقال بينهما.','How we move from one shot to the next. In generation tools you can ask for the transition in the prompt, or give the tool a first and last frame to build it.'],
 groups:[
 {ar:'القطع',en:'Cuts',items:[
  {en:'Hard Cut',ar:'قطع مباشر',d:'انتقال فوري من لقطة إلى أخرى دون أي تأثير. أكثر انتقال استخدامًا في المونتاج.',de:'An instant switch from one shot to the next with no effect. The most used transition in editing.',p:'Hard cut from the night scene to the sunrise scene',demo:ab('cut'),m:['Straight cut']},
  {en:'Jump Cut',ar:'قطع قافز',d:'قطع داخل اللقطة نفسها فيقفز الشخص في الزمن. يعطي إيقاعًا سريعًا، شائع في فيديوهات يوتيوب.',de:'A cut within the same shot, so the subject jumps in time. Creates fast rhythm, common in YouTube videos.',p:'Jump cuts within the same shot, the subject jumps forward in time, fast vlog rhythm',demo:ab('jump'),m:['Vlog cut']},
  {en:'Match Cut',ar:'قطع متطابق',d:'قطع بين لقطتين فيهما شكل أو حركة متشابهة في المكان نفسه من الكادر، فيربط العقل بينهما.',de:'A cut between two shots with a similar shape or motion in the same place in frame, so the mind links them.',p:'Match cut: the full moon transitions into the rising sun in the exact same position in frame',demo:ab('match'),m:['Graphic match']},
  {en:'J-Cut / L-Cut',ar:'قطع الصوت المتداخل',d:'في J-Cut يبدأ صوت اللقطة التالية قبل صورتها. وفي L-Cut يستمر صوت اللقطة السابقة بعد ظهور التالية. يجعل المونتاج أنعم.',de:'In a J-cut the next shot\'s sound starts before its picture. In an L-cut the previous shot\'s sound carries over the next picture. Makes edits feel smoother.',p:'J-cut: the audio of the next scene starts before we cut to its picture',demo:`<div class="demo jl"><div class="pv ab">${PANES()}<span class="snd">${t('صوت ٢ بدأ','Audio 2 starts')}</span></div><div class="tlw"><div class="tr"><b>V1</b><i class="v1"></i><i class="v2"></i></div><div class="tr"><b>A1</b><i class="a1"></i><i class="a2"></i></div><div style="position:absolute;inset:0 0 0 22px"><i class="phd"></i></div></div></div>`,m:['Split edit']},
 ]},
 {ar:'انتقالات بتأثير',en:'Effect transitions',items:[
  {en:'Cross Dissolve',ar:'مزج تدريجي',d:'اللقطة الأولى تذوب تدريجيًا في الثانية. يوحي بمرور الوقت أو بالذكرى.',de:'The first shot gradually melts into the second. Suggests time passing or memory.',p:'Slow cross dissolve between the two scenes',demo:ab('dissolve'),m:['Dissolve']},
  {en:'Fade to Black',ar:'تلاشٍ إلى الأسود',d:'الصورة تظلم تمامًا ثم تظهر اللقطة التالية. نهاية فصل أو مرور وقت طويل.',de:'The picture goes fully dark, then the next shot appears. End of a chapter or a long time jump.',p:'Fade to black, then fade in on the next scene',demo:ab('fadeblack'),m:['Fade out/in']},
  {en:'Dip to White / Flash',ar:'وميض أبيض',d:'وميض أبيض سريع بين لقطتين. للصدمة أو الذكريات أو الانتقال الحماسي.',de:'A quick white flash between two shots. For shock, flashbacks or energetic cuts.',p:'Quick white flash transition between the two shots',demo:ab('dipwhite'),m:['Flash cut']},
  {en:'Wipe',ar:'مسح',d:'اللقطة الجديدة تمسح القديمة بخط يتحرك عبر الكادر.',de:'The new shot wipes over the old one with a moving edge across the frame.',p:'Wipe transition from right to left revealing the next scene',demo:ab('wipe'),m:['Linear wipe']},
  {en:'Iris',ar:'دائرة',d:'دائرة تنفتح أو تنغلق لتكشف اللقطة التالية. طابع كلاسيكي وكرتوني.',de:'A circle opens or closes to reveal the next shot. Classic, cartoon feel.',p:'Iris-in transition, a circle opens from the center to reveal the next scene',demo:ab('iris'),m:['Iris in/out']},
  {en:'Push / Slide',ar:'دفع',d:'اللقطة الجديدة تدفع القديمة خارج الكادر. واضحة ومنظمة.',de:'The new shot pushes the old one out of frame. Clear and orderly.',p:'Push transition, the new scene slides in and pushes the old one out of frame',demo:ab('push'),m:['Slide']},
  {en:'Whip Transition',ar:'انتقال خاطف',d:'حركة سريعة جدًا مع ضبابية تربط لقطتين كأنهما لقطة واحدة. شائع في الريلز.',de:'A very fast move with blur links two shots as if they were one. Popular in Reels.',p:'Whip pan transition with heavy motion blur connecting the two scenes',demo:ab('whipT'),m:['Swish']},
  {en:'Zoom Transition',ar:'انتقال بالزووم',d:'زووم سريع داخل اللقطة الأولى ينتهي بدخول اللقطة الثانية.',de:'A fast zoom into the first shot ends with the second shot arriving.',p:'Fast zoom-through transition into the next scene with motion blur',demo:ab('zoomT'),m:['Zoom through']},
  {en:'Spin Transition',ar:'انتقال بالدوران',d:'الكادر يدور ويختفي ثم تظهر اللقطة التالية وهي تدور. حماسي وسريع.',de:'The frame spins away and the next shot spins in. Energetic and quick.',p:'Spin transition, the frame rotates quickly into the next shot',demo:ab('spin'),m:['Roll transition']},
  {en:'Glitch Transition',ar:'انتقال جليتش',d:'تشويش رقمي لحظي يفصل بين اللقطتين. مناسب للتقنية والموسيقى الإلكترونية.',de:'A moment of digital noise separates the two shots. Suits tech and electronic music.',p:'Digital glitch transition with RGB split and scanlines',demo:ab('glitch'),m:['RGB split']},
  {en:'Light Leak',ar:'تسريب ضوء',d:'وهج ضوء دافئ يعبر الكادر ويغطي لحظة القطع. طابع فيلم قديم وحنين.',de:'A warm glow sweeps across the frame and covers the cut. Vintage film, nostalgic.',p:'Warm light leak transition, film burn washing over the frame',demo:ab('lightleak'),m:['Film burn']},
  {en:'Morph Transition',ar:'تحول',d:'عنصر في اللقطة الأولى يتحول بسلاسة إلى عنصر في الثانية. من أقوى ما تفعله أدوات الذكاء الاصطناعي.',de:'An element in the first shot smoothly transforms into an element of the second. One of the strongest things AI tools do.',p:'Seamless morph transition, the moon transforms into the sun as the scene changes',demo:ab('morph'),m:['Start/end frame']},
 ]}
]},
{id:'ui',ar:'موشن الـ UI',en:'Interface Motion',nav:['موشن UI','UI Motion'],tools:'Figma Smart Animate · Framer Motion · CSS · Rive · Lottie · Lovable · v0',pre:'dur',
 intro:['الحركة داخل الواجهات لها وظيفة: توضح ما حدث، وتوجّه العين، وتربط الشاشات ببعضها. البرومبتات هنا مكتوبة لأدوات بناء الواجهات بالذكاء الاصطناعي، ومعها المدة والـ easing المقترحان. الأمثلة معروضة باتجاه عربي (RTL)؛ اعكس الاتجاهات للواجهات الإنجليزية.','Motion in interfaces has a job: explain what happened, guide the eye, and connect screens. The prompts here are written for AI UI builders, with a suggested duration and easing. Examples are shown in an Arabic (RTL) layout; mirror the directions for LTR interfaces.'],
 groups:[
 {ar:'منحنيات التسارع',en:'Easing curves',items:[
  {en:'Linear',ar:'سرعة ثابتة',d:'سرعة واحدة من البداية للنهاية. تبدو آلية، فاستخدمها فقط للحركة المستمرة مثل الدوران أو شريط التقدم.',de:'One speed from start to end. Looks mechanical, so use it only for continuous motion like spinners and progress.',p:'Use linear easing only for continuous motion such as spinners, marquees and progress',demo:ease('linear',{type:'bez',v:[0,0,1,1],lbl:'linear'}),m:['spinners'],meta:'linear'},
  {en:'Ease In',ar:'تسارع تدريجي',d:'تبدأ ببطء وتنتهي بسرعة. مناسبة للعناصر الخارجة من الشاشة.',de:'Starts slow, ends fast. Suits elements leaving the screen.',p:'Exit animation: fade and slide out over 200ms with ease-in cubic-bezier(0.55, 0, 1, 0.45)',demo:ease('cubic-bezier(.55,0,1,.45)',{type:'bez',v:[.55,0,1,.45],lbl:'ease-in'}),m:['exits'],meta:'cubic-bezier(.55,0,1,.45)'},
  {en:'Ease Out',ar:'تباطؤ تدريجي',d:'تبدأ بسرعة وتهدأ في النهاية. الأنسب للعناصر الداخلة لأنها تستجيب فورًا وتستقر بنعومة.',de:'Starts fast and settles gently. Best for entering elements: responds instantly, lands softly.',p:'Entrance animation: slide up 12px and fade in over 250ms with ease-out cubic-bezier(0, 0.55, 0.45, 1)',demo:ease('cubic-bezier(0,.55,.45,1)',{type:'bez',v:[0,.55,.45,1],lbl:'ease-out'}),m:['entrances'],meta:'cubic-bezier(0,.55,.45,1)'},
  {en:'Ease In-Out',ar:'تسارع ثم تباطؤ',d:'بطيئة في البداية والنهاية وسريعة في المنتصف. للعناصر التي تتحرك من مكان لآخر داخل الشاشة.',de:'Slow at both ends, fast in the middle. For elements moving from one place to another on screen.',p:'Move the element to its new position over 350ms with ease-in-out cubic-bezier(0.65, 0, 0.35, 1)',demo:ease('cubic-bezier(.65,0,.35,1)',{type:'bez',v:[.65,0,.35,1],lbl:'ease-in-out'}),m:['on-screen moves'],meta:'cubic-bezier(.65,0,.35,1)'},
