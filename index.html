  {en:'Expo Out',ar:'تباطؤ حاد',d:'انطلاقة سريعة جدًا ثم استقرار طويل ناعم. الإحساس المفضل في المواقع الحديثة والتطبيقات الفاخرة.',de:'A very fast start then a long smooth settle. The go-to feel for modern sites and premium apps.',p:'Use an expo-out curve cubic-bezier(0.16, 1, 0.3, 1) at 500ms for panels and page transitions',demo:ease('cubic-bezier(.16,1,.3,1)',{type:'bez',v:[.16,1,.3,1],lbl:'expo-out'}),m:['premium'],meta:'cubic-bezier(.16,1,.3,1)'},
  {en:'Back / Overshoot',ar:'تجاوز ثم رجوع',d:'العنصر يتجاوز مكانه قليلًا ثم يرجع. يعطي حيوية ومرحًا للأزرار والأيقونات.',de:'The element overshoots its target slightly and comes back. Adds life and playfulness to buttons and icons.',p:'Pop-in with slight overshoot: scale from 0.8 to 1 over 300ms using cubic-bezier(0.34, 1.56, 0.64, 1)',demo:ease('cubic-bezier(.34,1.56,.64,1)',{type:'bez',v:[.34,1.56,.64,1],lbl:'back-out'}),m:['playful'],meta:'cubic-bezier(.34,1.56,.64,1)'},
  {en:'Anticipation (Back In)',ar:'تمهيد عكسي',d:'العنصر يرجع للخلف قليلًا قبل أن ينطلق. يجهّز العين للحركة القادمة.',de:'The element pulls back a little before launching. Prepares the eye for what\'s next.',p:'Before sliding out, pull the element back slightly: cubic-bezier(0.36, 0, 0.66, -0.56) over 300ms',demo:ease('cubic-bezier(.36,0,.66,-.56)',{type:'bez',v:[.36,0,.66,-.56],lbl:'back-in'}),m:['wind-up'],meta:'cubic-bezier(.36,0,.66,-.56)'},
  {en:'Spring',ar:'زنبرك',d:'حركة فيزيائية تتذبذب قليلًا ثم تستقر. تُعرَّف بالصلابة (stiffness) والتخميد (damping) بدل المدة.',de:'Physics-based motion that oscillates slightly then settles. Defined by stiffness and damping instead of duration.',p:'Use a spring animation (stiffness 300, damping 20, mass 1) for the toggle and card interactions',demo:ease(SPRING,{type:'fn',f:springF,lbl:'spring'}),m:['stiffness','damping'],meta:'spring(300, 20)'},
  {en:'Bounce',ar:'ارتداد',d:'العنصر يرتطم ويرتد عدة مرات كالكرة. استخدمه بحذر، في الإشعارات المرحة أو الألعاب.',de:'The element hits and bounces a few times like a ball. Use sparingly: playful notifications or games.',p:'Drop the badge in with a bounce ease-out over 700ms',demo:ease(BOUNCE,{type:'fn',f:bounceF,lbl:'bounce'}),m:['games'],meta:'bounce-out'},
  {en:'Steps',ar:'خطوات متقطعة',d:'الحركة تقفز على مراحل ثابتة بلا انتقال ناعم. تُستخدم للسبرايت والعدادات وتأثير الكتابة.',de:'Motion jumps in fixed stages with no smoothing. For sprites, counters and typewriter effects.',p:'Animate the sprite sheet with steps(6) timing over 600ms',demo:ease('steps(6, end)',{type:'steps',n:6,lbl:'steps(6)'}),m:['sprites'],meta:'steps(6)'},
 ]},
 {ar:'التفاعلات الدقيقة',en:'Micro-interactions',items:[
  {en:'Button Press',ar:'ضغطة الزر',d:'الزر ينكمش قليلًا عند الضغط ثم يرجع. يؤكد للمستخدم أن ضغطته وصلت.',de:'The button shrinks slightly when pressed and springs back. Confirms the tap registered.',p:'Add a press animation to all buttons: scale to 0.95 on press over 100ms ease-out, then spring back to 1 on release',demo:ui(`<button class="u-btn a-press" tabindex="-1">${t('احجز الآن','Book now')}</button>${fing('fp')}`),m:['scale 0.95'],meta:'100ms · ease-out'},
  {en:'Hover Lift',ar:'ارتفاع عند التمرير',d:'البطاقة ترتفع وظلها يكبر عند مرور المؤشر فوقها. توضح أنها قابلة للضغط.',de:'The card rises and its shadow grows on hover. Signals that it\'s clickable.',p:'On hover, lift the card by 6px and deepen its shadow over 200ms ease-out; reverse on mouse leave',demo:ui(`<div class="u-card a-lift"><div class="u-img"></div><div class="u-l w70"></div><div class="u-l w45"></div></div>`),m:['translateY -6px'],meta:'200ms · ease-out'},
  {en:'Magnetic Hover',ar:'الزر المغناطيسي',d:'الزر ينجذب قليلًا نحو المؤشر عندما يقترب منه. لمسة مرحة في المواقع الإبداعية.',de:'The button is pulled slightly toward the cursor as it approaches. A playful touch on creative sites.',p:'Magnetic button: within 80px, move the button 30% of the cursor offset with a spring, reset on leave',demo:ui(`<div class="magw"><button class="u-btn mag" tabindex="-1">${t('ابدأ','Start')}</button>${fing('fmag')}</div>`),m:['cursor'],meta:'spring'},
  {en:'Ripple',ar:'تموج اللمس',d:'دائرة تتسع من مكان اللمس داخل الزر. علامة مميزة لنظام Material Design.',de:'A circle expands from the touch point inside the button. A Material Design signature.',p:'Add a Material-style ripple that expands from the tap point inside the button and fades out over 450ms',demo:ui(`<button class="u-btn" tabindex="-1">${t('متابعة','Continue')}<i class="a-rip"></i></button>`),m:['Material'],meta:'450ms · ease-out'},
  {en:'Toggle Switch',ar:'مفتاح التشغيل',d:'الدائرة تنزلق بحركة زنبركية ولون المسار يتغير. الحالة الجديدة واضحة من الشكل واللون معًا.',de:'The knob slides with a spring and the track changes color. The new state reads through shape and color together.',p:'Animate the toggle knob with a spring (stiffness 500, damping 30) and transition the track color over 200ms',demo:ui(`<div class="u-tog"><i></i></div>`),m:['200ms color'],meta:'spring'},
  {en:'Checkbox Tick',ar:'علامة الاختيار',d:'المربع ينضغط ويمتلئ باللون ثم تُرسم علامة الصح كخط. إحساس بالإنجاز.',de:'The box squeezes, fills with color, then the check is drawn as a line. Feels like completion.',p:'When the checkbox is checked, fill it with the brand color and draw the checkmark stroke over 250ms',demo:ui(`<div class="u-chk"><div class="u-box"><svg viewBox="0 0 24 24"><path d="M5.5 12.5l4.2 4.2L18.5 8"/></svg></div><span>${t('أوافق على الشروط','I agree to the terms')}</span></div>`),m:['stroke draw'],meta:'250ms · ease-out'},
  {en:'Like / Heart Burst',ar:'انفجار الإعجاب',d:'القلب ينكمش ثم يكبر ويمتلئ باللون مع حلقة وشرارات حوله. تفاعل مُرضٍ يشجع على التكرار.',de:'The heart shrinks, pops and fills with color, with a ring and sparks. A satisfying interaction that invites repeats.',p:'Like button: shrink the heart to 0.7, then pop to 1.25 and settle, fill it red, and emit a ring and 6 small particles',demo:ui(`<div class="u-heart"><i class="ring"></i><i class="spk"></i><svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.5 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.8 1.3-1.7 2.9-2.8 4.9-2.8 3.5 0 5.6 3.5 4.4 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg></div>`),m:['particles'],meta:'400ms · back-out'},
  {en:'Error Shake',ar:'اهتزاز الخطأ',d:'الحقل يهتز أفقيًا ويتحول للأحمر عند إدخال خاطئ، كأنه يقول «لا» بالحركة.',de:'The field shakes sideways and turns red on invalid input, saying "no" with motion.',p:'On invalid input, shake the field horizontally (−10, 9, −7, 5, −2px) over 400ms and turn the border red',demo:uic(`<div class="u-field"><span>${t('كلمة المرور','Password')}</span><b>••••••</b></div><div class="u-err">${t('كلمة المرور غير صحيحة','Incorrect password')}</div>`),m:['validation'],meta:'400ms'},
  {en:'Pulse / Attention',ar:'نبض لجذب الانتباه',d:'نقطة الإشعار تنبض بحلقات متسعة والجرس يهتز. يلفت النظر دون إزعاج.',de:'The notification dot pulses with expanding rings and the bell swings. Draws attention without nagging.',p:'Show a notification dot with expanding pulse rings every 1.2s and a short bell swing',demo:ui(`<div class="u-bell"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg><i class="r"></i><i class="r r2"></i><i class="dot"></i></div>`),m:['notification'],meta:'1.2s loop'},
  {en:'Floating Label',ar:'العنوان الطائر',d:'عنوان الحقل يصعد ويصغر عند التركيز فيه ليترك مكانًا للنص. يوفر المساحة ويبقي السياق.',de:'The field label moves up and shrinks on focus to make room for text. Saves space and keeps context.',p:'Floating label input: on focus, move the label up and scale to 0.8 over 200ms, change the border to the brand color',demo:ui(`<div class="u-fl"><label>${t('الاسم الكامل','Full name')}</label><span class="tx">${t('سارة خالد','Sara Khaled')}</span></div>`),m:['forms'],meta:'200ms · ease-out'},
  {en:'Tooltip Reveal',ar:'ظهور التلميح',d:'التلميح يظهر بتلاشٍ وارتفاع بسيط بعد تأخير قصير، ويختفي أسرع مما ظهر.',de:'Appears with a fade and slight rise after a short delay, and hides faster than it appeared.',p:'Tooltip: appear after 300ms delay with fade + 4px rise over 150ms, hide instantly on leave',demo:ui(`<div class="u-tipw"><div class="u-tip">${t('نسخ الرابط','Copy link')}</div><div class="u-ic">?</div></div>`),m:['delay 300ms'],meta:'150ms · ease-out'},
  {en:'Number Roll',ar:'تدوير الرقم',d:'الرقم القديم يصعد والجديد يظهر من أسفل، مع نبضة في الشارة. يوضح أن القيمة تغيرت.',de:'The old number rolls up and the new one comes from below, with a pulse on the badge. Shows the value changed.',p:'When the cart count changes, roll the old digit up and the new one in from below over 300ms and pulse the badge',demo:ui(`<div class="u-cart"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.3 10.2a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H6.2"/><circle cx="9" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/></svg><div class="u-badge"><div class="col"><span>2</span><span>3</span></div></div></div>`),m:['counters'],meta:'300ms · back-out'},
  {en:'Morphing Button',ar:'زر متحوّل',d:'الزر ينكمش إلى دائرة تحميل ثم يتحول إلى علامة نجاح خضراء. رحلة الإرسال كلها في عنصر واحد.',de:'The button shrinks to a loading circle then turns into a green success check. The whole submit journey in one element.',p:'Submit button morph: shrink to a 40px circle with a spinner while loading, then turn green and draw a checkmark on success',demo:ui(`<div class="u-mb"><span class="t">${t('إرسال','Send')}</span><span class="spw"><i></i></span><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></div>`),m:['loading → success'],meta:'400ms · ease-in-out'},
 ]},
 {ar:'التنقل والانتقال بين الشاشات',en:'Navigation & transitions',items:[
  {en:'Crossfade',ar:'تلاشٍ متبادل',d:'الشاشة الجديدة تظهر فوق القديمة بالشفافية. أبسط انتقال وأهدؤه.',de:'The new screen fades in over the old one. The simplest, calmest transition.',p:'Crossfade between screens over 250ms ease-in-out',demo:phone(SA+SB,'x-fade'),m:['calm'],meta:'250ms · ease-in-out'},
  {en:'Push Navigation',ar:'دفع الشاشة',d:'الشاشة الجديدة تدخل من جهة البداية وتدفع القديمة. في الواجهات العربية تدخل الشاشة الجديدة من اليسار.',de:'The new screen enters from the start edge and pushes the old one. In Arabic (RTL) interfaces the new screen enters from the left.',p:'Push transition for RTL: the new screen slides in from the left while the previous one shifts 30% right and dims, 350ms',demo:phone(SA+SB,'x-push'),m:['RTL aware'],meta:'350ms · expo-out'},
  {en:'Scale / Zoom In',ar:'تكبير الشاشة',d:'الشاشة الجديدة تكبر من 0.9 إلى حجمها مع التلاشي. توحي بالدخول إلى عمق التطبيق.',de:'The new screen scales up from 0.9 as it fades in. Suggests going deeper into the app.',p:'Screen enters by scaling from 0.9 to 1 with fade over 300ms ease-out',demo:phone(SA+SB,'x-scale'),m:['depth'],meta:'300ms · ease-out'},
  {en:'Modal / Dialog',ar:'نافذة منبثقة',d:'الخلفية تظلم والنافذة تظهر بتكبير بسيط من المنتصف. تركّز الانتباه على قرار واحد.',de:'The background dims and the dialog scales in slightly from the center. Focuses attention on one decision.',p:'Modal: fade in a 50% black backdrop and scale the dialog from 0.95 to 1 over 250ms ease-out',demo:phone(SA+`<div class="bd"></div><div class="dlg"><b></b>${lines(2)}<div class="btns"><u></u><u></u></div></div>`),m:['backdrop'],meta:'250ms · ease-out'},
  {en:'Bottom Sheet',ar:'لوحة من الأسفل',d:'لوحة تصعد من أسفل الشاشة مع تعتيم الخلفية. مريحة للإبهام على الجوال.',de:'A panel slides up from the bottom while the background dims. Comfortable for thumbs on mobile.',p:'Bottom sheet slides up from the bottom over 350ms with cubic-bezier(0.2, 0.8, 0.2, 1) and can be dragged down to dismiss',demo:phone(SA+`<div class="bd"></div><div class="sht"><i class="hd"></i>${lines(4)}</div>`),m:['mobile'],meta:'350ms · ease-out'},
  {en:'Side Drawer',ar:'قائمة جانبية',d:'قائمة تنزلق من جهة البداية (اليمين في العربية) فوق المحتوى.',de:'A menu slides in from the start edge (right in Arabic) over the content.',p:'Side drawer slides in from the right (RTL start edge) over 300ms with a dimmed backdrop',demo:phone(SA+`<div class="bd"></div><div class="drw"><i class="av"></i>${lines(5)}</div>`),m:['RTL start'],meta:'300ms · ease-out'},
  {en:'Shared Element (Hero)',ar:'عنصر مشترك',d:'الصورة الصغيرة في القائمة تكبر وتتحول إلى صورة الغلاف في الشاشة التالية. تربط الشاشتين في عقل المستخدم.',de:'The thumbnail in the list grows into the cover image on the next screen. Links both screens in the user\'s mind.',p:'Shared element transition: the thumbnail expands into the detail page header image over 450ms (Framer Motion layoutId / Figma Smart Animate)',demo:phone(`<div class="tg"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="hro"></div><div class="det"><div class="bg"></div>${lines(4)}</div>`),m:['layoutId','Smart Animate'],meta:'450ms · expo-out'},
  {en:'Container Transform',ar:'تحول الحاوية',d:'زر عائم يتمدد ليصبح الشاشة الجديدة نفسها. الانتقال يوضح من أين جاءت الشاشة.',de:'A floating button expands into the new screen itself. The transition shows where the screen came from.',p:'Container transform: the floating action button expands into a full-screen form over 400ms',demo:phone(SA+`<div class="fab"><div class="fc">${lines(4)}</div></div>`),m:['Material'],meta:'400ms · expo-out'},
  {en:'Accordion Expand',ar:'توسيع القائمة',d:'القسم يتمدد لأسفل ليكشف محتواه والسهم يدور. المحتوى تحته ينزل بسلاسة.',de:'The section expands to reveal content and the chevron rotates. Content below moves down smoothly.',p:'Accordion: expand the panel height over 300ms ease-in-out and rotate the chevron 180°',demo:ui(`<div class="acc"><div class="ar2"><span>${t('الشحن','Shipping')}</span><i class="chv"></i></div><div class="ar2 o"><span>${t('الاسترجاع','Returns')}</span><i class="chv"></i></div><div class="abody"><div>${lines(3)}</div></div><div class="ar2"><span>${t('الدفع','Payment')}</span><i class="chv"></i></div></div>`),m:['FAQ'],meta:'300ms · ease-in-out'},
  {en:'Tab Indicator Slide',ar:'انزلاق مؤشر التبويب',d:'الخلفية المميزة تنزلق من التبويب القديم إلى الجديد بدل أن تقفز.',de:'The highlight slides from the old tab to the new one instead of jumping.',p:'Segmented tabs: slide the active pill to the selected tab over 300ms with a spring',demo:ui(`<div class="tabs"><i class="ind"></i><span>${t('الكل','All')}</span><span>${t('الصور','Photos')}</span><span>${t('الفيديو','Videos')}</span></div>`),m:['segmented'],meta:'300ms · spring'},
  {en:'Carousel Snap',ar:'دوّار البطاقات',d:'البطاقات تنزلق وتستقر على بطاقة كاملة مع مؤشر نقاط يتحدث.',de:'Cards slide and settle on a full card while a dot indicator updates.',p:'Horizontal carousel with scroll-snap, cards settle with ease-out, dot indicator updates',demo:ui(`<div class="car"><div class="rw"><i></i><i></i><i></i></div><div class="dots"><b style="--i:0"></b><b style="--i:1"></b><b style="--i:2"></b></div></div>`),m:['scroll-snap'],meta:'400ms · ease-out'},
  {en:'Toast / Snackbar',ar:'إشعار عابر',d:'رسالة قصيرة تصعد من الأسفل وتختفي وحدها بعد ثوانٍ.',de:'A short message rises from the bottom and disappears by itself after a few seconds.',p:'Toast: slide up from the bottom with slight overshoot over 300ms, stay 3s, then slide down',demo:phone(SA+`<div class="tst"><i></i>${t('تم الحفظ','Saved')}</div>`),m:['auto-dismiss'],meta:'300ms · back-out'},
 ]},
 {ar:'التحميل والاستجابة',en:'Loading & feedback',items:[
  {en:'Skeleton Shimmer',ar:'هيكل التحميل اللامع',d:'أشكال رمادية بحجم المحتوى الحقيقي يمر عليها وميض. تقلل الإحساس بالانتظار.',de:'Grey shapes matching the real content with a shimmer passing over. Reduces perceived waiting.',p:'Show skeleton placeholders matching the layout with a shimmer gradient sweeping every 1.5s',demo:ui(`<div class="skc"><div class="r"><i class="sk av"></i><div style="flex:1;display:grid;gap:6px"><i class="sk ln" style="width:70%"></i><i class="sk ln" style="width:45%"></i></div></div><i class="sk bx"></i><i class="sk ln" style="width:85%"></i></div>`),m:['placeholder'],meta:'1.5s · linear'},
  {en:'Spinner',ar:'مؤشر دوّار',d:'دائرة تدور وطول خطها يتغير. للانتظار القصير غير المعروف مدته.',de:'A rotating circle whose stroke length changes. For short waits of unknown length.',p:'Circular spinner: rotate 360° every 1.6s linear while the stroke length grows and shrinks',demo:ui(`<svg class="spn" viewBox="0 0 44 44"><circle cx="22" cy="22" r="18"/></svg>`),m:['indeterminate'],meta:'1.6s · linear'},
  {en:'Progress Bar',ar:'شريط التقدم',d:'المحدد يُظهر النسبة الحقيقية، وغير المحدد شريط يتحرك باستمرار عندما لا نعرف المدة.',de:'Determinate shows the real percentage; indeterminate moves continuously when duration is unknown.',p:'Determinate progress bar filling from the start edge, plus an indeterminate variant sliding continuously',demo:uic(`<div class="pg"><small><span>Determinate</span></small><div class="pbar"><i></i></div><small><span>Indeterminate</span></small><div class="pbar ind"><i></i></div></div>`),m:['RTL fill'],meta:'ease-out'},
  {en:'Typing Indicator',ar:'مؤشر الكتابة',d:'ثلاث نقاط تقفز بالتتابع. توضح أن الطرف الآخر يكتب الآن.',de:'Three dots bounce in sequence. Shows the other side is typing right now.',p:'Typing indicator: three dots bouncing in sequence with a 150ms stagger',demo:ui(`<div class="typ"><i></i><i></i><i></i></div>`),m:['chat'],meta:'1.2s loop'},
  {en:'Success Check',ar:'علامة النجاح',d:'دائرة تُرسم ثم علامة صح داخلها مع نبضة. تغلق العملية بإحساس واضح.',de:'A circle is drawn, then a check inside with a pulse. Closes the task with a clear feeling.',p:'Success state: draw the circle stroke, then the checkmark, then a small scale pulse, total 800ms',demo:ui(`<svg class="suc" viewBox="0 0 64 64"><circle pathLength="100" cx="32" cy="32" r="27"/><path pathLength="100" d="M20 33l8 8 16-17"/></svg>`),m:['stroke draw'],meta:'800ms'},
  {en:'Blur-up Image Load',ar:'ظهور الصورة من الضبابية',d:'نسخة صغيرة مغبشة تظهر أولًا ثم تتضح الصورة الأصلية عند تحميلها.',de:'A small blurred version appears first, then the full image sharpens in once loaded.',p:'Progressive image loading: show a blurred placeholder, then crossfade to the sharp image over 400ms',demo:ui(`<div class="bu">${LND}</div>`),m:['LQIP'],meta:'400ms · ease-out'},
 ]},
 {ar:'حركة التمرير',en:'Scroll motion',items:[
  {en:'Parallax Scroll',ar:'بارالاكس التمرير',d:'الخلفية تتحرك أبطأ من المحتوى أثناء التمرير، فيظهر عمق بين الطبقات.',de:'The background moves slower than the content while scrolling, creating depth between layers.',p:'Parallax hero: the background image scrolls at 30% of the content speed',demo:phone(`<div class="pbg">${LND}</div><div class="pcont">${range(6,()=>'<div class="cd"></div>')}</div>`),m:['scroll-linked'],meta:'scroll-linked'},
  {en:'Reveal on Scroll',ar:'الظهور عند التمرير',d:'العناصر تظهر بتلاشٍ وصعود بسيط عندما تدخل الشاشة.',de:'Elements fade and rise slightly as they enter the screen.',p:'Reveal on scroll: as each section enters the viewport, fade in and move up 16px over 500ms ease-out',demo:phone(`<div class="fu">${range(5,i=>`<div class="it" style="--i:${i}"><i></i><b></b></div>`)}</div>`),m:['IntersectionObserver'],meta:'500ms · ease-out'},
  {en:'Staggered List',ar:'قائمة متتابعة',d:'عناصر القائمة تدخل واحدًا تلو الآخر بفارق زمني بسيط، فتقرأها العين بالترتيب.',de:'List items enter one after another with a small delay, so the eye reads them in order.',p:'Stagger the list items: each slides in from the start edge with 60ms delay between items',demo:phone(`<div class="fu sl">${range(5,i=>`<div class="it" style="--i:${i}"><i></i><b></b></div>`)}</div>`),m:['stagger 60ms'],meta:'300ms · ease-out'},
  {en:'Sticky Header Shrink',ar:'رأس يصغر عند التمرير',d:'الرأس الكبير يصغر ويثبت أعلى الشاشة عند التمرير، فيوفر المساحة ويبقي العنوان ظاهرًا.',de:'A large header shrinks and sticks to the top on scroll, saving space while keeping the title visible.',p:'Large title header that shrinks into a compact sticky bar as the user scrolls down',demo:phone(`<div class="hdr">${t('الرئيسية','Home')}</div><div class="cnt2">${range(5,()=>'<div class="cd"></div>')}</div>`),m:['iOS large title'],meta:'scroll-linked'},
  {en:'Scroll Progress',ar:'مؤشر تقدم القراءة',d:'شريط رفيع أعلى الصفحة يمتلئ بقدر ما قرأت من المقال.',de:'A thin bar at the top fills as you read through the article.',p:'Reading progress bar at the top that fills from the start edge as the article scrolls',demo:phone(`<i class="spb"></i><div class="scnt">${lines(20)}</div>`),m:['scroll-timeline'],meta:'scroll-linked'},
  {en:'Marquee / Ticker',ar:'شريط متحرك',d:'نص أو شعارات تمر أفقيًا بلا توقف. شائع لعرض العملاء أو الأخبار.',de:'Text or logos scroll horizontally non-stop. Common for client logos or news.',p:'Infinite marquee of client logos scrolling horizontally at constant speed, pause on hover',demo:ui(`<div class="mq"><div class="tr">${('<span>Pan</span><span>Tilt</span><span>Dolly</span><span>Orbit</span><span>Truck</span><span>Crane</span>').repeat(2)}</div><div class="tr rv">${('<span>Spring</span><span>Ease-out</span><span>Stagger</span><span>Morph</span><span>Parallax</span><span>Reveal</span>').repeat(2)}</div></div>`),m:['infinite'],meta:'linear'},
 ]},
 {ar:'الإيماءات والإتاحة',en:'Gestures & accessibility',items:[
  {en:'Swipe to Dismiss',ar:'السحب للإزالة',d:'البطاقة تتبع الإصبع وتدور قليلًا ثم تطير خارج الشاشة، وتظهر التي تحتها.',de:'The card follows the finger with a slight rotation, then flies off screen, revealing the one beneath.',p:'Swipeable card stack: the card follows the finger with slight rotation, flies off past a threshold, and the next card scales up',demo:ui(`<div class="swc"><div class="c c2"><div class="ln w80"></div><div class="ln w60"></div></div><div class="c c1"><div class="ln w80"></div><div class="ln w60"></div></div></div>${fing('fsw')}`),m:['threshold'],meta:'spring'},
  {en:'Drag & Reorder',ar:'السحب وإعادة الترتيب',d:'العنصر يرتفع بظل عند الإمساك به، والعناصر الأخرى تفسح له المكان.',de:'The item lifts with a shadow when grabbed, and the others make room for it.',p:'Drag to reorder: lift the grabbed item (scale 1.04 + shadow) and animate the other items to their new positions',demo:ui(`<div class="drg"><div class="it d1"><i class="gp"></i><i style="background:var(--accent)"></i><b></b></div><div class="it d2"><i class="gp"></i><i style="background:var(--key)"></i><b></b></div><div class="it d3"><i class="gp"></i><i style="background:var(--ok)"></i><b></b></div></div>`),m:['layout animation'],meta:'250ms · ease-out'},
  {en:'Pull to Refresh',ar:'اسحب للتحديث',d:'المحتوى ينزل مع الإصبع ويظهر مؤشر دوّار، ثم يرجع بعد انتهاء التحديث.',de:'Content follows the finger down, a spinner appears, then it springs back when refresh finishes.',p:'Pull to refresh: the content follows the drag with resistance, a spinner appears past 60px, then everything springs back',demo:phone(`<div class="prs"><i></i></div><div class="prw">${SA}</div>${fing('fpr')}`,'prf'),m:['elastic'],meta:'spring'},
  {en:'Pinch to Zoom',ar:'التكبير بإصبعين',d:'الصورة تكبر حسب تباعد الإصبعين، وترجع بحركة زنبركية عند الإفلات.',de:'The image scales with the spread of two fingers and springs back on release.',p:'Pinch to zoom on the image, clamp between 1× and 3×, spring back to fit on release',demo:ui(`<div class="pz">${LND}</div>${fing('fz1')}${fing('fz2')}`),m:['gesture'],meta:'spring'},
  {en:'Long Press',ar:'الضغط المطوّل',d:'حلقة تمتلئ حول الإصبع أثناء الضغط، ثم تظهر قائمة الخيارات.',de:'A ring fills around the finger while holding, then the options menu appears.',p:'Long press: shrink the item slightly while a progress ring fills for 500ms, then pop a context menu with overshoot',demo:ui(`<div class="lpw"><div class="lpm"><span>${t('نسخ','Copy')}</span><span>${t('مشاركة','Share')}</span><span>${t('حذف','Delete')}</span></div><div class="lpi"></div><svg class="lpr" viewBox="0 0 44 44"><circle pathLength="100" cx="22" cy="22" r="19"/></svg>${fing('flp2')}</div>`),m:['500ms hold'],meta:'500ms'},
  {en:'Reduced Motion',ar:'تقليل الحركة',d:'بعض المستخدمين يفعّلون خيار تقليل الحركة لأن الحركة تسبب لهم دوارًا. استبدل الانزلاق والتكبير والبارالاكس بتلاشٍ بسيط.',de:'Some users turn on reduced motion because movement makes them dizzy. Replace slides, zooms and parallax with a simple fade.',p:'Respect prefers-reduced-motion: replace slides, zooms and parallax with simple opacity fades, disable autoplay',demo:ui(`<div class="rdm"><figure><div class="bx2 full"><i></i></div><figcaption>Full motion</figcaption></figure><figure><div class="bx2 red"><i></i></div><figcaption>Reduced</figcaption></figure></div>`),m:['a11y','prefers-reduced-motion'],meta:'fade only'},
 ]}
]},
{id:'mograph',ar:'موشن جرافيك',en:'Motion Graphics',nav:['موشن جرافيك','Motion Graphics'],tools:'After Effects · Cavalry · Rive · Lottie · Jitter · Runway · Kling',
 intro:['مبادئ التحريك الكلاسيكية ثم أشهر تقنيات الموشن جرافيك. أسماء التقنيات هي نفسها أسماء الأدوات والتأثيرات في After Effects، والبرومبتات مكتوبة لأدوات توليد الفيديو.','The classic principles of animation, then the most used motion graphics techniques. Technique names match the tools and effects in After Effects, and the prompts are written for video generation tools.'],
 groups:[
 {ar:'مبادئ التحريك الاثنا عشر',en:'The 12 principles of animation',items:[
  {en:'Squash & Stretch',ar:'الضغط والتمدد',d:'الجسم يتمدد أثناء السرعة وينضغط عند الاصطدام مع ثبات حجمه. يعطي إحساسًا بالوزن والمرونة.',de:'The body stretches when fast and squashes on impact while keeping its volume. Gives weight and flexibility.',p:'2D motion graphics: a bouncy ball with exaggerated squash on impact and stretch in the air, clean flat background',demo:ui(`<div class="bnc"><i class="sh"></i><div class="bw"><div class="b"></div></div></div>`),m:['AE: Scale']},
  {en:'Anticipation',ar:'التمهيد',d:'حركة صغيرة معاكسة قبل الحركة الرئيسية، مثل الانحناء قبل القفز. تجهّز المشاهد لما سيحدث.',de:'A small opposite move before the main action, like crouching before a jump. Prepares the viewer.',p:'Cute character crouches down in anticipation, then leaps up high and lands with a squash',demo:ui(`<div class="ant"><i class="sh"></i><div class="ch"><i></i><i></i></div></div>`),m:['wind-up']},
  {en:'Staging',ar:'التقديم',d:'توجيه عين المشاهد إلى الشيء المهم بالضوء أو الحجم أو الحركة، مع تهدئة الباقي.',de:'Directing the viewer\'s eye to what matters with light, size or motion, while calming the rest.',p:'Spotlight staging: dim the surrounding shapes while the hero element glows and gently moves',demo:ui(`<div class="stg"><i class="spot"></i><i></i><i class="hero2"></i><i></i></div>`),m:['hierarchy']},
  {en:'Pose to Pose',ar:'الوضعيات المفتاحية',d:'تحديد الوضعيات الأساسية أولًا (Keyframes) ثم ملء ما بينها (In-betweens). عكسها Straight Ahead حيث يُرسم كل كادر بالتتابع.',de:'Set the key poses first (keyframes), then fill the frames between (in-betweens). Its opposite, straight ahead, draws every frame in sequence.',p:'Keyframe animation between three key poses, smooth in-betweens, timeline with keyframes visible',demo:uic(`<div class="p2p"><i class="g g1"></i><i class="g g2"></i><i class="g g3"></i><i class="bl"></i></div><div class="kt"><b></b><b></b><b></b><s></s></div>`),m:['Keyframes','Straight ahead']},
  {en:'Follow Through & Overlap',ar:'الاستمرار والتداخل',d:'الأجزاء المرنة تكمل حركتها بعد توقف الجسم، وكل جزء يتحرك بتأخير عن الآخر.',de:'Loose parts keep moving after the body stops, and each part moves with a delay after the other.',p:'A box slides and stops while its antenna keeps swinging and settles, follow-through and overlapping action',demo:ui(`<div class="fol"><div class="bx"><i class="an"><b></b></i></div></div>`),m:['drag']},
  {en:'Slow In & Slow Out',ar:'التباطؤ في الطرفين',d:'الحركة تبطؤ عند البداية والنهاية، مثل الأشياء الحقيقية. في After Effects اسمها Easy Ease.',de:'Motion eases at the start and end, like real objects. In After Effects it\'s called Easy Ease.',p:'Compare linear motion to eased motion, smooth slow-in and slow-out',demo:uic(`<div class="sio"><span>Linear</span><div class="tk lin"><i></i></div></div><div class="sio"><span>Ease</span><div class="tk"><i></i></div></div>`),m:['AE: Easy Ease (F9)']},
  {en:'Arcs',ar:'الأقواس',d:'الحركة الطبيعية تسير في أقواس لا في خطوط مستقيمة: كرة مقذوفة أو ذراع تتأرجح.',de:'Natural motion travels in arcs, not straight lines: a thrown ball, a swinging arm.',p:'Object travels along a smooth arc path, natural motion trajectory',demo:ui(`<div class="arc2"><svg viewBox="0 0 240 120"><path class="dsh2" d="M16 104 L224 104"/><path class="dsh" d="M16 104 Q120 -30 224 104"/></svg><i class="ab2"></i></div>`),m:['Motion path']},
  {en:'Secondary Action',ar:'الحركة الثانوية',d:'حركة صغيرة تدعم الحركة الأساسية دون أن تسرق الانتباه، مثل رمش العين أو اهتزاز الهوائي أثناء القفز.',de:'A small action that supports the main one without stealing focus, like a blink or an antenna wag during a hop.',p:'A small creature hops across while its antenna wags and it blinks, secondary actions supporting the main hop',demo:ui(`<div class="sec2"><div class="mv"><div class="hp"><i class="tl2"></i><div class="bd2"></div><i class="ey"></i><i class="ey r"></i></div></div></div>`),m:['personality']},
  {en:'Timing',ar:'التوقيت',d:'عدد الكادرات يحدد الوزن والإحساس. الثقيل بطيء وقفزته قصيرة، والخفيف سريع وقفزته عالية.',de:'The number of frames defines weight and feel. Heavy is slow with a short bounce; light is fast with a high bounce.',p:'Two balls bouncing side by side: a heavy one slow and low, a light one fast and high',demo:ui(`<div class="tim"><figure><div class="hv"></div><figcaption>${t('ثقيل','Heavy')}</figcaption></figure><figure><div class="lt"></div><figcaption>${t('خفيف','Light')}</figcaption></figure></div>`),m:['weight']},
  {en:'Exaggeration',ar:'المبالغة',d:'تضخيم الحركة عن الواقع لتصبح أوضح وأكثر تعبيرًا. المقارنة هنا بين حركة واقعية وأخرى مبالغ فيها.',de:'Pushing motion beyond reality so it reads clearer and more expressive. Here: realistic vs exaggerated.',p:'Exaggerated cartoon bounce with extreme squash and stretch next to a realistic bounce',demo:ui(`<div class="pair"><figure><div class="bnc mild"><i class="sh"></i><div class="bw"><div class="b"></div></div></div><figcaption>Real</figcaption></figure><figure><div class="bnc x"><i class="sh"></i><div class="bw"><div class="b"></div></div></div><figcaption>Exaggerated</figcaption></figure></div>`),m:['cartoon']},
  {en:'Solid Drawing',ar:'الرسم المجسّم',d:'التعامل مع الأشكال ككتل لها حجم ووزن في فراغ ثلاثي الأبعاد، حتى في الرسم المسطح.',de:'Treating shapes as masses with volume and weight in 3D space, even in flat drawing.',p:'Rotating 3D cube with consistent perspective and volume, clean geometric motion design',demo:ui(`<div class="cube3"><div class="cb3"><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="f4"></i><i class="f5"></i><i class="f6"></i></div></div>`),m:['volume']},
  {en:'Appeal',ar:'الجاذبية',d:'تصميم الشخصية وحركتها بطريقة محببة وسهلة القراءة: شكل بسيط وتعبير واضح.',de:'Designing a character and its motion to be likable and easy to read: simple shapes, clear expression.',p:'Adorable round mascot character idling with a gentle breathing squash and blinking eyes',demo:ui(`<div class="apl"><div class="bdy"><i class="ey l"></i><i class="ey r"></i><i class="ck l"></i><i class="ck r"></i><i class="mo"></i></div><i class="sh"></i></div>`),m:['charm']},
 ]},
 {ar:'تحريك النصوص',en:'Type in motion',items:[
  {en:'Kinetic Typography',ar:'تايبوجرافي حركي',d:'الكلمات تظهر وتتحرك على إيقاع الكلام أو الموسيقى. الأساس في فيديوهات الاقتباسات والإعلانات.',de:'Words appear and move to the rhythm of speech or music. The core of quote videos and ads.',p:'Kinetic typography: bold words pop in one by one in sync with the beat, scale and rotate, flat background',demo:`<div class="demo"><div class="kin" dir="${t('rtl','ltr')}">${(LANG==='ar'?['حرّك','الكلام','بإيقاع']:['MOVE','THE','WORDS']).map((w,i)=>`<span style="--i:${i}">${w}</span>`).join('')}</div></div>`,m:['AE: Text Animators']},
  {en:'Text Mask Reveal',ar:'كشف النص بالقناع',d:'النص يصعد من خلف خط مخفي كأنه يخرج من شق. أنيق ومنتشر في المواقع والإعلانات.',de:'Text rises from behind a hidden line, as if coming out of a slit. Elegant and common on websites and ads.',p:'Text reveal: each line slides up from behind an invisible mask, elegant editorial motion',demo:ui(`<div class="msk"><div class="ln2"><span>${t('لكل حركة','Every move')}</span></div><div class="ln2"><span style="--i:1">${t('اسم','has a name')}</span></div></div>`),m:['AE: Track Matte']},
  {en:'Typewriter',ar:'الآلة الكاتبة',d:'الحروف تظهر واحدًا تلو الآخر مع مؤشر يومض. مناسب للكود والرسائل والعناوين التقنية.',de:'Letters appear one by one with a blinking cursor. Suits code, messages and tech titles.',p:'Typewriter text animation with a blinking cursor, monospaced font',demo:ui(`<div class="tw">camera: slow dolly in</div>`),m:['AE: preset']},
  {en:'Letter Stagger',ar:'تتابع الحروف',d:'كل حرف يدخل بتأخير بسيط عن الذي قبله. في العربية يُفضَّل التتابع بالكلمة للحفاظ على اتصال الحروف.',de:'Each letter enters slightly after the previous one. For Arabic, stagger by word to keep letters connected.',p:'Letter-by-letter stagger animation, each character rises and rotates in with a 70ms offset',demo:ui(`<div class="lst">${'MOTION'.split('').map((c,i)=>`<span style="--i:${i}">${c}</span>`).join('')}</div>`),m:['AE: Offset']},
  {en:'Text Scramble',ar:'فك التشفير',d:'حروف عشوائية تتبدل بسرعة ثم تستقر على الكلمة الصحيحة. طابع تقني أو سينمائي.',de:'Random characters cycle fast then settle on the right word. Techy or cinematic.',p:'Text scramble decode effect: random characters cycle quickly then resolve into the title',demo:ui(`<div class="scrm" data-scr="DOLLY ZOOM">DOLLY ZOOM</div>`),m:['decode']},
  {en:'Lower Third',ar:'الشريط السفلي',d:'شريط يظهر أسفل الشاشة باسم المتحدث ووظيفته. أساسي في المقابلات والبودكاست.',de:'A bar at the bottom of the screen with the speaker\'s name and title. Essential for interviews and podcasts.',p:'Clean lower third: an accent bar slides in, the name reveals from a mask, the title fades in below',demo:`<div class="demo"><div class="l3w">${LND}<div class="l3 ${t('r','')}"><i class="bar3"></i><div class="nm3"><span>${t('سارة خالد','Sara Khaled')}</span></div><span class="rl3">${t('مصممة منتجات','Product Designer')}</span></div></div></div>`,m:['interviews']},
 ]},
 {ar:'الأشكال والمسارات',en:'Shapes & paths',items:[
  {en:'Trim Paths / Line Draw',ar:'رسم الخط',d:'الخط يُرسم من بدايته حتى نهايته ثم يُمحى. من أكثر الأدوات استخدامًا في After Effects.',de:'A line draws itself from start to end, then erases. One of the most used tools in After Effects.',p:'Line drawing animation, a single stroke draws itself on and then off, trim paths effect',demo:ui(`<svg class="trim" viewBox="0 0 200 100"><path pathLength="100" d="M10 60C40 10 70 10 90 50S140 90 160 40S190 20 190 60"/></svg>`),m:['AE: Trim Paths']},
  {en:'Shape Morph',ar:'تحوّل الشكل',d:'شكل يتحول بسلاسة إلى شكل آخر: دائرة إلى مربع إلى ورقة.',de:'One shape smoothly transforms into another: circle to square to leaf.',p:'Smooth shape morphing: circle to square to leaf shape, rotating, flat colors',demo:ui(`<div class="mph"></div>`),m:['Path keyframes']},
  {en:'Liquid / Blob',ar:'الشكل السائل',d:'كتلة عضوية تتموج حوافها باستمرار. تعطي إحساسًا حيًا وناعمًا.',de:'An organic mass whose edges ripple continuously. Feels alive and soft.',p:'Organic liquid blob with gradient, softly morphing edges, seamless loop',demo:ui(`<div class="blob"></div>`),m:['organic']},
  {en:'Motion Path',ar:'مسار الحركة',d:'العنصر يتبع مسارًا منحنيًا مرسومًا ويدور مع اتجاهه.',de:'The element follows a drawn curved path and rotates along its direction.',p:'Paper plane follows a curved motion path and auto-orients along it',demo:ui(`<div class="mp"><svg viewBox="0 0 240 120"><path class="dsh" d="M10 92C60 -12 100 132 140 52S220 8 232 70"/></svg><i class="pl"></i></div>`),m:['AE: Auto-Orient']},
  {en:'Map Route',ar:'مسار على الخريطة',d:'خط يُرسم على خريطة من نقطة لأخرى مع علامة تتحرك عليه. للسفر والتوصيل والقصص.',de:'A line draws across a map from one point to another with a moving marker. For travel, delivery and stories.',p:'Animated map route: a line draws from pin A to pin B with a moving marker, flat map style',demo:ui(`<div class="mapw"><svg class="map" viewBox="0 0 280 140">${[[10,10,60,40],[80,8,70,34],[170,50,50,40],[230,70,40,60],[20,70,70,40],[100,90,60,40],[180,100,40,30]].map(r=>`<rect class="blk" x="${r[0]}" y="${r[1]}" width="${r[2]}" height="${r[3]}" rx="4"/>`).join('')}<path class="rt" pathLength="100" d="M18 118 C 60 118, 60 60, 110 60 S 170 20, 250 22"/><circle class="pin2" cx="18" cy="118" r="6"/><circle class="pin" cx="250" cy="22" r="6"/></svg><i class="mk"></i></div>`),m:['travel']},
  {en:'Repeater / Radial',ar:'التكرار الدائري',d:'نسخ متعددة من شكل واحد موزعة حول مركز، تتحرك بتتابع.',de:'Many copies of one shape arranged around a center, animating in sequence.',p:'Radial repeater of bars around a center, pulsing in sequence, rotating slowly',demo:ui(`<div class="rep">${range(12,i=>`<i style="--i:${i}"></i>`)}</div>`),m:['AE: Repeater']},
  {en:'Stagger / Offset',ar:'الإزاحة الزمنية',d:'مجموعة عناصر تتحرك بالحركة نفسها لكن بتأخير متدرج، فتتكون موجة.',de:'A group of elements do the same motion with a graded delay, forming a wave.',p:'Grid of dots animating in a diagonal wave with staggered offsets',demo:ui(`<div class="sgr">${range(32,i=>`<i style="--d:${(i%8)+Math.floor(i/8)}"></i>`)}</div>`),m:['wave']},
  {en:'Seamless Loop',ar:'حلقة متصلة',d:'حركة تنتهي حيث بدأت تمامًا فتتكرر بلا قطع. أساسية في الـ GIF وخلفيات المواقع.',de:'Motion that ends exactly where it began so it repeats with no cut. Essential for GIFs and website backgrounds.',p:'Perfect seamless loop of three orbs orbiting a center, no visible start or end',demo:ui(`<div class="orb3"><s></s><i></i><i></i><i></i><b></b></div>`),m:['loopOut()']},
  {en:'Wiggle',ar:'الاهتزاز العشوائي',d:'اهتزاز عشوائي مستمر في الموضع والدوران. تعبير شهير في After Effects يحدد التردد والشدة.',de:'Continuous random jitter in position and rotation. A famous After Effects expression with frequency and amplitude.',p:'Shape with a random jittery wiggle in position and rotation, energetic',demo:uic(`<div class="wig"></div><span class="code">wiggle(4, 12)</span>`),m:['AE expression']},
  {en:'Echo / Trails',ar:'الأثر',d:'نسخ باهتة تتبع العنصر بتأخير فتترك أثرًا يوضح مساره وسرعته.',de:'Faded copies trail the element with a delay, showing its path and speed.',p:'Moving ball leaving fading echo trails behind it',demo:ui(`<div class="ech">${range(6,i=>`<i style="--i:${i}"></i>`)}</div>`),m:['AE: Echo']},
  {en:'Isometric',ar:'أيزومتريك',d:'رسم ثلاثي الأبعاد بزوايا ثابتة (30 درجة) دون منظور. شائع في شرح المنتجات والتقنية.',de:'3D drawing at fixed 30° angles with no perspective. Common in product and tech explainers.',p:'Isometric 3D blocks dropping into place one by one with a bouncy ease',demo:ui(`<svg class="iso" viewBox="0 0 200 120">${(()=>{const s=22,h=s*.866;const c=(x,y,i)=>`<g style="--i:${i}"><polygon class="it" points="${x},${y-s/2} ${x+h},${y} ${x},${y+s/2} ${x-h},${y}"/><polygon class="il" points="${x-h},${y} ${x},${y+s/2} ${x},${y+s*1.5} ${x-h},${y+s}"/><polygon class="ir" points="${x+h},${y} ${x},${y+s/2} ${x},${y+s*1.5} ${x+h},${y+s}"/></g>`;return c(100,40,0)+c(100,18,3)+c(100-h,51,1)+c(100+h,51,2)+c(100,62,4)})()}</svg>`),m:['30°']},
  {en:'3D Flip',ar:'قلب ثلاثي الأبعاد',d:'البطاقة تنقلب حول محورها لتكشف وجهها الآخر.',de:'The card flips on its axis to reveal its other side.',p:'Card flips 180 degrees in 3D to reveal its back side',demo:ui(`<div class="flp"><div class="fcd"><div class="fr">${t('أمام','Front')}</div><div class="bk">${t('خلف','Back')}</div></div></div>`),m:['rotateY']},
  {en:'Shape Transition',ar:'انتقال بالأشكال',d:'دوائر ملونة تتسع من المنتصف بالتتابع وتغطي الشاشة. انتقال شائع بين مشاهد الموشن جرافيك.',de:'Colored circles expand from the center in sequence and cover the screen. A common scene transition in motion graphics.',p:'Circle shape transition: three colored circles expand from the center in quick succession to wipe the screen',demo:`<div class="demo"><div class="swp"><i></i><i></i><i></i></div></div>`,m:['wipe']},
  {en:'Walk Cycle',ar:'دورة المشي',d:'حركة مشي تتكرر في المكان والأرض تتحرك تحتها. أساس تحريك الشخصيات.',de:'A walk that repeats in place while the ground moves beneath. The foundation of character animation.',p:'2D character walk cycle in profile, looping, flat vector style',demo:ui(`<div class="wcy"><i class="gl3"></i><div class="bd3"><i class="lg b"></i><i class="am b"></i><i class="tr3"></i><i class="hd3"></i><i class="lg a"></i><i class="am a"></i></div></div>`),m:['character','loop']},
 ]},
 {ar:'المؤثرات',en:'Effects',items:[
  {en:'Particles / Burst',ar:'الجسيمات',d:'نقاط صغيرة تنفجر من مركز وتتلاشى. للاحتفال والنجاح والتأثيرات السحرية.',de:'Small dots burst from a center and fade. For celebration, success and magic effects.',p:'Colorful particle burst exploding outward from the center and fading, celebration',demo:ui(`<div class="ptc"><b></b>${(()=>{const c=['var(--accent)','var(--key)','var(--ok)','var(--heart)'];return range(18,i=>{const a=i/18*Math.PI*2,r=46+(i%3)*16;return `<i style="--dx:${(Math.cos(a)*r).toFixed(1)}px;--dy:${(Math.sin(a)*r).toFixed(1)}px;background:${c[i%4]}"></i>`})})()}</div>`),m:['AE: Particular']},
  {en:'Glitch',ar:'جليتش',d:'تشويش رقمي: انفصال ألوان RGB وشرائح تنزاح. طابع تقني وموسيقي.',de:'Digital noise: RGB channel split and shifting slices. Techy and musical.',p:'Glitch text effect with RGB channel split, horizontal slice displacement, digital noise',demo:ui(`<div class="gl" data-t="GLITCH">GLITCH</div>`),m:['RGB split']},

{id:'fix',ar:'مشاكل شائعة وحلولها',en:'Troubleshooting',nav:['حل المشاكل','Fixes'],tools:'Applies to every video generation tool',

  {en:'Wrong Speed',ar:'سرعة غير مناسبة',d:'الحركة أسرع أو أبطأ من الطبيعي، كأنها مسرّعة. حدّد الإيقاع صراحة.',de:'Motion runs faster or slower than natural, as if sped up. State the pace explicitly.',p:'Natural real-time speed, slow deliberate movement',demo:bad('toofast','','TOO FAST'),neg:['sped up','fast forward']},
 ]},

 ]}

const GLOSS=[
['Keyframe','كي فريم','نقطة على التايملاين تحدد فيها قيمة (موضع أو حجم أو لون)، والبرنامج يملأ الحركة بين النقاط.','A point on the timeline where you set a value (position, scale, color); the software fills the motion between points.'],
['In-between / Tween','الكادرات البينية','الكادرات التي تقع بين كي فريم وآخر. في الرسم اليدوي تُرسم باليد، وفي البرامج تُحسب تلقائيًا.','The frames between two keyframes. Drawn by hand in traditional animation, calculated automatically in software.'],
['Interpolation','الاستيفاء','طريقة حساب القيم بين الكي فريمات: Linear أو Bezier أو Hold (قفزة بلا انتقال).','How values are calculated between keyframes: linear, bezier, or hold (a jump with no transition).'],
['Easing','التسارع','تغيّر السرعة خلال الحركة بدل السرعة الثابتة. يجعل الحركة طبيعية.','Changing speed during a move instead of constant speed. Makes motion feel natural.'],
['Graph Editor','محرر المنحنيات','أداة لرسم منحنى السرعة (Speed Graph) أو منحنى القيمة (Value Graph) للتحكم الدقيق في الـ easing.','A tool to shape the speed graph or value graph for precise control of easing.'],
['Frame','كادر','صورة واحدة من الفيديو. الفيديو سلسلة كادرات تُعرض بسرعة.','A single image in a video. Video is a sequence of frames shown quickly.'],
['Frame Rate (fps)','معدل الكادرات','عدد الكادرات في الثانية. 24 سينمائي، 30 تلفزيون وسوشيال، 60 حركة ناعمة جدًا.','Frames per second. 24 is cinematic, 30 is TV and social, 60 is very smooth.'],
['Timecode','الكود الزمني','عنوان كل كادر بصيغة ساعة:دقيقة:ثانية:كادر، مثل 00:00:04:12.','Each frame\'s address as hours:minutes:seconds:frames, e.g. 00:00:04:12.'],
['Motion Blur','ضبابية الحركة','التلطخ الطبيعي للأجسام السريعة. غيابه يجعل الحركة متقطعة وغير واقعية.','The natural smear of fast objects. Without it, motion looks choppy and unreal.'],
['Shutter Angle','زاوية الغالق','تحدد كمية ضبابية الحركة. قاعدة 180° هي الإحساس السينمائي المعتاد.','Controls how much motion blur you get. The 180° rule is the standard cinematic look.'],
['Composition (Comp)','الكومب','الحاوية الأساسية في After Effects التي تضم الطبقات والتايملاين، وليست التكوين البصري.','The main container in After Effects holding layers and a timeline; not visual composition.'],
['Pre-compose','التجميع المسبق','تجميع عدة طبقات في كومب داخلي لتحريكها ككتلة واحدة.','Grouping layers into a nested comp so you can animate them as one unit.'],
['Null Object','كائن فارغ','طبقة غير مرئية تُستخدم كمقبض للتحكم في طبقات أخرى مربوطة بها.','An invisible layer used as a handle to control other layers linked to it.'],
['Parenting','الربط الأبوي','ربط طبقة بأخرى لتتبع حركتها، مثل ربط اليد بالذراع.','Linking a layer to another so it follows its motion, like a hand to an arm.'],
['Rigging','التجهيز الهيكلي','بناء هيكل من العظام والمفاصل للشخصية لتحريكها بسهولة.','Building a skeleton of bones and joints so a character can be animated easily.'],
['Mask / Matte','القناع','شكل يحدد الجزء الظاهر من طبقة. Track Matte يستخدم طبقة أخرى كقناع.','A shape that defines which part of a layer is visible. A track matte uses another layer as the mask.'],
['Rotoscoping','الروتوسكوب','فصل الشخص عن الخلفية كادرًا بكادر. أدوات الذكاء الاصطناعي تفعله تلقائيًا الآن.','Cutting a subject out of the background frame by frame. AI tools now do it automatically.'],
['Motion Tracking','تتبع الحركة','تحليل حركة نقطة في الفيديو لتثبيت نص أو عنصر عليها.','Analyzing how a point moves in footage so you can pin text or graphics to it.'],
['Stabilization','التثبيت','إزالة الاهتزاز غير المرغوب من الفيديو.','Removing unwanted shake from footage.'],
['Color Grading','التلوين','ضبط الألوان والتباين لإعطاء الفيديو مزاجًا موحدًا.','Adjusting color and contrast to give the video one consistent mood.'],
['LUT','جدول الألوان','ملف جاهز يطبق تلوينًا معينًا بضغطة واحدة.','A preset file that applies a color look in one step.'],
['Lottie','لوتي','صيغة JSON خفيفة لتشغيل أنيميشن After Effects داخل التطبيقات والمواقع.','A lightweight JSON format for playing After Effects animations in apps and websites.'],
['Rive State Machine','آلة الحالات في Rive','نظام يربط الأنيميشن بحالات وتفاعلات (hover, press, success) دون كود كثير.','A system that links animations to states and interactions (hover, press, success) with little code.'],
['Spring Physics','فيزياء الزنبرك','تحريك بقيم stiffness و damping و mass بدل مدة ثابتة. الأكثر طبيعية في الواجهات.','Animating with stiffness, damping and mass instead of a fixed duration. The most natural feel in UI.'],
['Stagger','التتابع','تأخير بسيط متدرج بين عناصر متشابهة تتحرك بالحركة نفسها.','A small graded delay between similar elements doing the same motion.'],
['Parallax','بارالاكس','القريب يتحرك أسرع من البعيد. أساس الإحساس بالعمق.','Near things move faster than far things. The basis of perceived depth.'],
['Depth Map','خريطة العمق','صورة رمادية توضح بُعد كل جزء عن الكاميرا. تُستخدم لصنع 2.5D من صورة مسطحة.','A grayscale image showing each part\'s distance from camera. Used to make 2.5D from a flat image.'],
['Temporal Consistency','الثبات الزمني','أن تبقى الأشكال والألوان ثابتة من كادر لآخر. غيابه يسبب الوميض والتحول.','Shapes and colors staying stable from frame to frame. Without it you get flicker and morphing.'],
['Prompt Adherence (CFG)','الالتزام بالبرومبت','مدى التزام الأداة بالنص حرفيًا. القيم العالية أدق لكن قد تقلل الطبيعية.','How literally the tool follows the text. Higher is more exact but can look less natural.'],
['Denoise / Restyle Strength','شدة التغيير','في Video-to-Video: كم يتغير الفيديو الأصلي. منخفضة تحافظ عليه، عالية تعيد رسمه.','In video-to-video: how much the source changes. Low keeps it, high repaints it.'],
['Seed','البذرة','رقم نقطة البداية العشوائية. نفس الـ Seed ونفس البرومبت يعطيان نتيجة قريبة.','The random starting number. Same seed plus same prompt gives a similar result.'],
['Upscale','رفع الدقة','تكبير الفيديو لدقة أعلى مع توليد تفاصيل جديدة.','Enlarging video to a higher resolution while generating new detail.'],
['Aspect Ratio','نسبة الأبعاد','نسبة العرض إلى الارتفاع: 16:9، 9:16، 1:1، 4:5، 2.39:1.','Width to height ratio: 16:9, 9:16, 1:1, 4:5, 2.39:1.'],
['Resolution','الدقة','عدد البكسلات: 720p و1080p و4K. الأعلى أوضح وأبطأ في التوليد.','Pixel count: 720p, 1080p, 4K. Higher is sharper and slower to generate.'],
];

const TABS=[
 {id:'generate',ar:'التوليد',en:'Generate',secs:['start','compose','setup','fix'],d:['ابدأ من هنا: طريقة العمل، ومُركّب البرومبت، وإعدادات أدوات التوليد، وحلول المشاكل الشائعة.','Start here: the workflow, the prompt builder, generation settings, and fixes for common problems.']},
 {id:'video',ar:'الفيديو',en:'Video',secs:['camera','shots','subject','light','time','cuts'],d:['لغة الفيديو التي تكتبها في البرومبت: حركات الكاميرا، واللقطات والزوايا والتكوين، وحركة الموضوع والبيئة، والإضاءة، والسرعة والعدسة، والانتقالات.','The film language you write into prompts: camera moves, shots, angles and composition, subject and ambient motion, lighting, speed and lens, and transitions.']},
 {id:'interface',ar:'موشن UI',en:'UI Motion',secs:['ui'],d:['الحركة داخل الواجهات: منحنيات التسارع، والتفاعلات الدقيقة، والتنقل بين الشاشات، والتحميل، والتمرير، والإيماءات.','Motion inside interfaces: easing curves, micro-interactions, navigation, loading, scroll and gestures.']},
 {id:'motion',ar:'موشن جرافيك',en:'Motion Graphics',secs:['mograph'],d:['مبادئ التحريك الاثنا عشر، وتحريك النصوص، والأشكال والمسارات، والمؤثرات.','The 12 principles of animation, type in motion, shapes and paths, and effects.']},
 {id:'terms',ar:'المصطلحات',en:'Glossary',secs:['glossary'],d:['المصطلحات التي ستقابلها في برامج التحريك وأدوات الذكاء الاصطناعي.','Terms you will meet in animation software and AI tools.']},
];
const TABOF={};TABS.forEach(tb=>tb.secs.forEach(x=>TABOF[x]=tb.id));
let CUR='generate';
{const h=location.hash.slice(1);if(TABS.some(tb=>tb.id===h))CUR=h;else if(TABOF[h])CUR=TABOF[h];}
function tabCount(tb){if(tb.id==='terms')return GLOSS.length;return SEC.filter(s=>tb.secs.includes(s.id)).reduce((a,s)=>a+s.count,0)}
function renderTabs(){
  document.getElementById('nav').innerHTML=TABS.map(tb=>`<a href="#${tb.id}" data-go="${tb.id}" class="${tb.id===CUR?'act':''}">${t(tb.ar,tb.en)}<b>${tabCount(tb)}</b></a>`).join('');
  const tb=TABS.find(x=>x.id===CUR);
  const one=tb.secs.length===1?SEC.find(x=>x.id===tb.secs[0]):null;
  const desc=one?t(one.intro[0],one.intro[1]):t(tb.d[0],tb.d[1]);
  const tools=one?`<div class="toolsline mono" style="font-size:12px;color:var(--ink-3);direction:ltr;text-align:${t('right','left')}">${one.tools}</div>`:'';
  const cnt=`<div class="mono" style="font-size:12px;color:var(--ink-3)">${tabCount(tb)} ${S_('terms')}</div>`;
  document.getElementById('tabhead').innerHTML=CUR==='generate'?'':`<div class="tabhead"><div class="eyebrow">${tb.en}</div><h1>${t(tb.ar,tb.en)}</h1><p>${desc}</p>${tools}${cnt}</div>`;
  let links=[];
  if(CUR==='generate')links=[['start',S_('start')],['compose',S_('prompt')],...SEC.filter(s=>tb.secs.includes(s.id)).map(s=>[s.id,t(s.nav[0],s.nav[1]),s.count])];
  else if(tb.secs.length>1)links=SEC.filter(s=>tb.secs.includes(s.id)).map(s=>[s.id,t(s.nav[0],s.nav[1]),s.count]);
  else{const s=SEC.find(x=>x.id===tb.secs[0]);if(s)links=s.groups.map((g,gi)=>[`g-${s.id}-${gi}`,t(g.ar,g.en),g.items.length])}
  document.getElementById('subnav').innerHTML=links.length?`<span>${t('في هذا الجزء:','In this part:')}</span>`+links.map(l=>`<a href="#${l[0]}">${l[1]}${l[2]?`<b>${l[2]}</b>`:''}</a>`).join(''):'';
  const i=TABS.findIndex(x=>x.id===CUR),nx=TABS[(i+1)%TABS.length];
  document.getElementById('nexttab').innerHTML=`<a class="nextt" href="#${nx.id}" data-go="${nx.id}"><div><small>${t('الجزء التالي','Next part')}</small><strong>${t(nx.ar,nx.en)}</strong><span style="display:block">${t(nx.d[0],nx.d[1])}</span></div><i>${t('←','→')}</i></a>`;
}
function showTab(id,top=true){
  CUR=id;
  document.querySelectorAll('[data-tab]').forEach(el=>el.hidden=el.dataset.tab!==id);
  document.querySelectorAll('[data-sec],[data-grp]').forEach(el=>{if(el.dataset.tab===id||el.closest('[data-tab]')?.dataset.tab===id)el.hidden=false});
  document.getElementById('subnav').hidden=false;document.getElementById('tabhead').hidden=false;document.getElementById('nexttab').hidden=false;
  const single=TABS.find(x=>x.id===id).secs.length===1;
  document.querySelectorAll('.sec-head').forEach(h=>{const sec=h.closest('[data-sec]');h.hidden=single&&!!sec&&sec.dataset.tab===id});
  renderTabs();
  {const a=document.querySelector('.bar .tabs2 a.act');if(a)try{a.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  try{history.replaceState(null,'','#'+id)}catch(e){}

  let s=cap((head?head+' of ':'')+(v('f-subj')||'the subject'))+'.';
  const act=v('f-act');if(act)s+=` The subject ${act}.`;
  const amb=v('f-amb');if(amb)s+=` ${cap(amb)}.`;
  const mv=v('f-move');if(mv)s+=` Camera: ${[v('f-pace'),mv].filter(Boolean).join(' ')}.`;
  [v('f-light'),v('f-speed'),v('f-lens')].filter(Boolean).forEach(x=>s+=` ${cap(x)}.`);
  const st=v('f-style');if(st)s+=` Style: ${st}.`;
  if(document.getElementById('f-neg').checked)s+=`\n\nNegative prompt: morphing, warping, flicker, distorted face, extra fingers, text, watermark${mv&&!mv.includes('handheld')?', camera shake':''}`;
  document.getElementById('f-out').textContent=s;
}
function setupChecks(){
  const upd=()=>{document.getElementById('ccount').textContent=t(`أنجزت ${checks.size} من 10`,`${checks.size} of 10 done`)};
  document.querySelectorAll('.check input').forEach((el,i)=>el.addEventListener('change',()=>{el.checked?checks.add(i):checks.delete(i);upd()}));upd();
}

/* ---------- copy ---------- */
function copyText(txt,btn){
  const orig=btn.textContent;
  const ok=()=>{btn.textContent=S_('copied');btn.classList.add('done');setTimeout(()=>{btn.textContent=orig;btn.classList.remove('done')},1400)};
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(e){}ta.remove()};
  try{navigator.clipboard.writeText(txt).then(ok).catch(fallback)}catch(e){fallback()}
}
document.getElementById('sections').addEventListener('click',e=>{
  const b=e.target.closest('.cp');if(b){copyText(b.previousElementSibling.textContent,b);return}
  const c=e.target.closest('.pr code');if(c)c.classList.toggle('open');
});

/* ---------- search ---------- */
function filter(v){
  const q=v.trim().toLowerCase();let any=0;
  document.querySelectorAll('#sections .card').forEach(c=>{const hit=!q||c.dataset.q.includes(q);c.hidden=!hit;if(hit)any++});
  if(!q){document.getElementById('none').hidden=true;showTab(CUR,false);return}
  document.querySelectorAll('[data-tab]').forEach(el=>el.hidden=true);
  document.querySelectorAll('[data-grp]').forEach(g=>g.hidden=!g.querySelector('.card:not([hidden])'));
  document.querySelectorAll('[data-sec]').forEach(s=>s.hidden=!s.querySelector('.card:not([hidden])'));
  ['subnav','tabhead','nexttab'].forEach(id=>document.getElementById(id).hidden=true);
  document.querySelectorAll('.sec-head').forEach(h=>h.hidden=false);
  document.querySelectorAll('.bar .tabs2 a').forEach(a=>a.classList.remove('act'));
  document.getElementById('none').hidden=!!any;
}
document.getElementById('q').addEventListener('input',e=>filter(e.target.value));

/* ---------- play / pause / language ---------- */
const pbtn=document.getElementById('pause');
function setStill(v){document.body.classList.toggle('still',v);pbtn.textContent=v?S_('play'):S_('pause');pbtn.setAttribute('aria-pressed',v)}
pbtn.addEventListener('click',()=>setStill(!document.body.classList.contains('still')));
if(matchMedia('(prefers-reduced-motion: reduce)').matches)document.body.classList.add('still');
document.getElementById('lang').addEventListener('click',()=>{LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('ml-lang',LANG)}catch(e){}const y=scrollY;render();scrollTo(0,y)});

let io=null;
function bindCards(){
  const cards=[...document.querySelectorAll('#sections .card')];
  if('IntersectionObserver' in window){if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(en=>en.target.classList.toggle('on',en.isIntersecting)),{rootMargin:'120px 0px'});cards.forEach(c=>io.observe(c))}
  else cards.forEach(c=>c.classList.add('on'));
  scr=[...document.querySelectorAll('[data-scr]')].map(el=>({el,txt:el.dataset.scr,g:!!el.dataset.garble,start:performance.now()+Math.random()*800}));
  tcEl=document.getElementById('tc');
}

/* ---------- timecode + scramble ---------- */
let tcEl=null,acc=0,last=performance.now(),scr=[];
const CH='ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*+=<>/';
function tick(now){
  if(!document.body.classList.contains('still')){acc+=now-last;
    const f=Math.floor(acc/1000*24)%144,sec=Math.floor(f/24),fr=f%24;if(tcEl)tcEl.textContent=`00:00:${String(sec).padStart(2,'0')}:${String(fr).padStart(2,'0')}`;
    scr.forEach(o=>{const card=o.el.closest('.card');if(!card||!card.classList.contains('on'))return;const p=((now-o.start)%3200)/3200;const n=o.txt.length;
      if(o.g&&Math.floor(now/180)===o.lt)return;o.lt=Math.floor(now/180);
      const solved=o.g?0:Math.floor(Math.max(0,Math.min(1,(p-.1)/.5))*n);let h='';
      for(let i=0;i<n;i++){const c=o.txt[i];if(c===' '){h+=' ';continue}const keep=o.g?rnd(i+Math.floor(now/180))>.45:(i<solved||p>.85);h+=keep?c:`<i>${CH[Math.floor(Math.random()*CH.length)]}</i>`}
      if(o.last!==h){o.el.innerHTML=h;o.last=h}});
  }
  last=now;requestAnimationFrame(tick);
}
render();requestAnimationFrame(tick);
{const h=location.hash.slice(1);const el=h&&!TABS.some(tb=>tb.id===h)&&document.getElementById(h);if(el)setTimeout(()=>el.scrollIntoView(),50)}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(TABS.some(tb=>tb.id===h)){showTab(h);return}const el=document.getElementById(h);const tb=el&&el.closest('[data-tab]');if(tb&&tb.dataset.tab!==CUR){showTab(tb.dataset.tab,false);el.scrollIntoView()}});
</script>
